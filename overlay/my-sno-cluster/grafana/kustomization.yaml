---
# Grafana Dashboards overlay for my-sno-cluster
# Deploys all GrafanaDashboard CRs from the base into the grafana namespace.
# The Grafana operator (the operators-grafana-operator app) must be running before ArgoCD syncs this.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../bases/grafana/
