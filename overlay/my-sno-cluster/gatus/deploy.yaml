apiVersion: v1
kind: Namespace
metadata:
  name: gatus
---
apiVersion: v1
data:
  config.yaml: |
    ui:
      title: "Platform Status Dashboard"
      header: "API, Route & Internal Probe Health"
      description: "Real-time health status of OpenShift services and internal microservices"
      logo: "https://upload.wikimedia.org/wikipedia/commons/3/3a/OpenShift-LogoType.svg"
      theme: "dark"

    storage:
      type: sqlite
      path: /data/gatus.db

    endpoints:

      # ---------------------------------------------------------------------------
      # Platform Endpoints
      # ---------------------------------------------------------------------------

      - name: "OpenShift Console"
        group: "Platform Endpoints"
        url: "https://console-openshift-console.apps.cluster-sdpvb.sdpvb.sandbox1464.opentlc.com"
        interval: 1m
        client:
          insecure: true
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] <= 499"

      - name: "OpenShift Downloads"
        group: "Platform Endpoints"
        url: "https://downloads-openshift-console.apps.cluster-sdpvb.sdpvb.sandbox1464.opentlc.com"
        interval: 1m
        client:
          insecure: true
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] <= 499"

      - name: "OAuth"
        group: "Platform Endpoints"
        url: "https://oauth-openshift.apps.cluster-sdpvb.sdpvb.sandbox1464.opentlc.com"
        interval: 1m
        client:
          insecure: true
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] <= 499"

      - name: "OpenShift GitOps"
        group: "Platform Endpoints"
        url: "https://openshift-gitops-server-openshift-gitops.apps.cluster-sdpvb.sdpvb.sandbox1464.opentlc.com"
        interval: 1m
        client:
          insecure: true
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] <= 499"

      - name: "Ingress Canary"
        group: "Platform Endpoints"
        url: "https://canary-openshift-ingress-canary.apps.cluster-sdpvb.sdpvb.sandbox1464.opentlc.com"
        interval: 1m
        client:
          insecure: true
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] <= 499"

      - name: "Data Science Gateway"
        group: "Platform Endpoints"
        url: "https://data-science-gateway.apps.cluster-sdpvb.sdpvb.sandbox1464.opentlc.com"
        interval: 1m
        client:
          insecure: true
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] <= 499"

      - name: "RHOAI Dashboard"
        group: "Platform Endpoints"
        url: "https://rhods-dashboard-redhat-ods-applications.apps.cluster-sdpvb.sdpvb.sandbox1464.opentlc.com"
        interval: 1m
        client:
          insecure: true
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] <= 499"

      - name: "MaaS Gateway"
        group: "Platform Endpoints"
