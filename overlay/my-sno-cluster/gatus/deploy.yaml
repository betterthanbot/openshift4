        interval: 1m
        client:
          insecure: true
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] <= 499"

      - name: "Grafana"
        group: "Platform Endpoints"
        url: "https://grafana-a-route-grafana.apps.cluster-sdpvb.sdpvb.sandbox1464.opentlc.com"
        interval: 1m
        client:
          insecure: true
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] <= 499"

      - name: "Gatus"
        group: "Platform Endpoints"
        url: "https://gatus-gatus.apps.cluster-sdpvb.sdpvb.sandbox1464.opentlc.com"
        interval: 1m
