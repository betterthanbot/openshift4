      - name: "Prometheus"
        group: "Monitoring"
        url: "https://prometheus-k8s-openshift-monitoring.apps.cluster-sdpvb.sdpvb.sandbox1464.opentlc.com/api"
        interval: 1m
        client:
          insecure: true
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] <= 499"

      - name: "Prometheus Federate"
        group: "Monitoring"
        url: "https://prometheus-k8s-federate-openshift-monitoring.apps.cluster-sdpvb.sdpvb.sandbox1464.opentlc.com/federate"
        interval: 1m
        client:
