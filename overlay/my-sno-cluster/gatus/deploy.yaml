        interval: 1m
        client:
          insecure: true
        conditions:
          - "[STATUS] >= 200"
          - "[STATUS] <= 499"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: gatus
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: gatus
    app.kubernetes.io/version: latest
    helm.sh/chart: gatus-1.0.4
  name: gatus-config
  namespace: gatus
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: gatus
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: gatus
    app.kubernetes.io/version: latest
    helm.sh/chart: gatus-1.0.4
  name: gatus
  namespace: gatus
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app.kubernetes.io/instance: gatus
    app.kubernetes.io/name: gatus
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/instance: gatus
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: gatus
    app.kubernetes.io/version: latest
    helm.sh/chart: gatus-1.0.4
  name: gatus-data
  namespace: gatus
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: gatus
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: gatus
    app.kubernetes.io/version: latest
    helm.sh/chart: gatus-1.0.4
  name: gatus
  namespace: gatus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: gatus
      app.kubernetes.io/name: gatus
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: gatus
        app.kubernetes.io/name: gatus
    spec:
      containers:
      - image: quay.io/rhn-support-gong/gatus:1.0.4
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 30
        name: gatus
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - mountPath: /config/config.yaml
          name: config-volume
          subPath: config.yaml
        - mountPath: /data
          name: data-volume
      volumes:
      - configMap:
          name: gatus-config
        name: config-volume
      - name: data-volume
        persistentVolumeClaim:
          claimName: gatus-data
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  labels:
    app.kubernetes.io/instance: gatus
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: gatus
    app.kubernetes.io/version: latest
    helm.sh/chart: gatus-1.0.4
  name: gatus
  namespace: gatus
spec:
  port:
    targetPort: http
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: gatus
    weight: 100
  wildcardPolicy: None
