---
# The openrag-stack subcharts pin non-root UIDs (app/embedder 10001, MinIO 1000,
# etcd 1001) that fall outside the namespace's restricted-v2 range. nonroot-v2
# admits any non-zero UID and still forbids root; pods that don't pin a UID keep
# getting restricted-v2.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openrag-scc-nonroot-v2
  namespace: openrag
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:nonroot-v2
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:serviceaccounts:openrag
