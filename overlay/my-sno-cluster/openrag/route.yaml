---
# The UI/API entry point: the frontend (Next.js) proxies API calls to the backend internally,
# so one Route is enough. The host is explicit — update it when the cluster domain changes.
#
# SECURITY: with no auth provider configured OpenRAG runs in "no-auth" mode, where every
# visitor is an admin who can upload documents, change settings and spend your MaaS key.
# Either configure Google/Microsoft OAuth (see the project's docs) or restrict the Route:
#   haproxy.router.openshift.io/ip_whitelist: "203.0.113.7 198.51.100.0/24"
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: openrag
  namespace: openrag
  annotations:
    # Chat/agent replies can sit silent longer than the 30s router default.
    haproxy.router.openshift.io/timeout: 5m
spec:
  host: openrag.apps.cluster-68qgz.68qgz.sandbox2261.opentlc.com
  to:
    kind: Service
    name: openrag-frontend
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
