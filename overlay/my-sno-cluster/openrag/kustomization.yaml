---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../bases/openrag/
  - namespace.yaml
  - scc-nonroot.yaml
  - route.yaml

# Chat LLM endpoint — points at your own RHOAI model.
# Edit llm-endpoint-patch.yaml and put the endpoint's token in openrag-env-secrets
# (key API_KEY). See README.md.
patches:
  - path: llm-endpoint-patch.yaml
