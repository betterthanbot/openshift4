# ==============================================================================
# Model serving overlay for my-sno-cluster.
#
# Discovered automatically by argocd/appset-workloads.yaml (git directory
# generator over overlay/my-sno-cluster/*), so no ApplicationSet edit is needed.
#
# The vllm-project namespace itself is created in wave 1 by
# operators/layer1-install (extraNamespaces) so RHOAI can label it before any
# model lands here.
# ==============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../bases/model-serving/
