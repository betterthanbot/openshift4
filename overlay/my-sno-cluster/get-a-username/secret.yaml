---
# Placeholder Secret for the get-a-username tool's user-facing password.
#
# ArgoCD CREATES this secret on first sync (with the placeholder values below)
# and then NEVER overwrites it — `ignoreDifferences` on this Secret's /data in
# argocd/appset-workloads.yaml, combined with RespectIgnoreDifferences=true,
# makes both the diff AND the sync skip the data field.
#
# Values below are base64, NOT stringData — the ignoreDifferences jsonPointer
# is literally `/data`, so a `stringData:` block would not be matched and the
# protection would silently do nothing. Decoded, they are:
#   LAB_REDIS_PASS        = redis              (must match bases/get-a-username/redis-secret.yaml)
#   LAB_USER_ACCESS_TOKEN = <set-me-oc-edit>
#   LAB_USER_PASS         = <set-me-oc-edit>
#   LAB_ADMIN_PASS        = <set-me-oc-edit>
#
# Set the real values via the OpenShift Web Console or CLI:
#   oc edit secret get-a-username-secret -n guides
#   # or, non-interactively:
#   oc patch secret get-a-username-secret -n guides --type=merge \
#     -p '{"stringData":{"LAB_USER_PASS":"<real>","LAB_ADMIN_PASS":"<real>","LAB_USER_ACCESS_TOKEN":"<real>"}}'
#
# This value must match whatever password the workshop-htpasswd identity
# provider actually authenticates (see operators/layer2-operands/values.yaml
# workshopAuth + overlay/my-sno-cluster/get-a-username/README.md) — it's what
# this tool tells attendees to log in with, not a credential it enforces itself.
apiVersion: v1
kind: Secret
metadata:
  name: get-a-username-secret
  namespace: guides
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
data:
  LAB_REDIS_PASS: cmVkaXM=
  LAB_USER_ACCESS_TOKEN: PHNldC1tZS1vYy1lZGl0Pg==
  LAB_USER_PASS: PHNldC1tZS1vYy1lZGl0Pg==
  LAB_ADMIN_PASS: PHNldC1tZS1vYy1lZGl0Pg==
