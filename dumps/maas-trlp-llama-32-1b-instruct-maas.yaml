apiVersion: kuadrant.io/v1alpha1
kind: TokenRateLimitPolicy
metadata:
  annotations:
    maas.opendatahub.io/subscriptions: team-alpha,team-bravo
  labels:
    app.kubernetes.io/component: token-rate-limit-policy
    app.kubernetes.io/managed-by: maas-controller
    app.kubernetes.io/part-of: maas-subscription
    maas.opendatahub.io/model: llama-32-1b-instruct-maas
    maas.opendatahub.io/model-namespace: vllm-project
  name: maas-trlp-llama-32-1b-instruct-maas
  namespace: vllm-project
spec:
  limits:
    models-as-a-service-team-alpha-llama-32-1b-instruct-maas-tokens:
      counters:
        - expression: auth.identity.userid
      rates:
        - limit: 10000
          window: 1m
      when:
        - predicate: auth.identity.selected_subscription_key == "models-as-a-service/team-alpha@vllm-project/llama-32-1b-instruct-maas" && !request.path.endsWith("/v1/models")
    models-as-a-service-team-bravo-llama-32-1b-instruct-maas-tokens:
      counters:
        - expression: auth.identity.userid
      rates:
        - limit: 10000
          window: 1m
      when:
        - predicate: auth.identity.selected_subscription_key == "models-as-a-service/team-bravo@vllm-project/llama-32-1b-instruct-maas" && !request.path.endsWith("/v1/models")
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: llama-32-1b-instruct-maas-kserve-route
