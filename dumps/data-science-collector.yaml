apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  labels:
    platform.opendatahub.io/part-of: monitoring
  name: data-science-collector
  namespace: redhat-ods-monitoring
spec:
  config:
    exporters:
      otlp/tempo:
        auth:
          authenticator: bearertokenauth
        endpoint: tempo-data-science-tempomonolithic-gateway.redhat-ods-monitoring.svc.cluster.local:4317
        headers:
          X-Scope-OrgID: redhat-ods-monitoring
        tls:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          enabled: true
        tls:
          cert_file: /etc/otel-collector/tls/tls.crt
          key_file: /etc/otel-collector/tls/tls.key
    extensions:
      bearertokenauth:
        filename: /var/run/secrets/kubernetes.io/serviceaccount/token
    processors:
      batch:
        send_batch_size: 10000
      k8sattributes: {}
      memory_limiter:
        check_interval: 1s
        limit_mib: 4000
        spike_limit_mib: 800
      resourcedetection:
        detectors:
          - openshift
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              job_name: data-science-collector-prometheus
              kubernetes_sd_configs:
                - role: pod
              metrics_path: /metrics
              relabel_configs:
                - action: keep
                  regex: true
                  source_labels:
                    - __meta_kubernetes_pod_label_monitoring_opendatahub_io_scrape
                - action: replace
                  regex: ([^:]+)(?::\d+)?
                  replacement: $1:8080
                  source_labels:
                    - __address__
                  target_label: __address__
              scrape_interval: 30s
              scrape_timeout: 10s
              tls_config:
                insecure_skip_verify: true
            - bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              job_name: dcgm-exporter-accelerator-metrics
              kubernetes_sd_configs:
                - namespaces:
                    names:
                      - nvidia-gpu-operator
                  role: pod
              metric_relabel_configs:
                - action: drop
                  regex: DCGM_FI_DEV_GPU_UTIL|DCGM_FI_DEV_MEM_COPY_UTIL
                  source_labels:
                    - __name__
                - regex: nvidia_gpu_(utilization|memory_utilization)_ratio
                  replacement: "true"
                  source_labels:
                    - __name__
                  target_label: __tmp_scale_needed
                - action: keep
                  regex: (nvidia_gpu_temperature_celsius|nvidia_gpu_utilization_ratio|nvidia_gpu_memory_utilization_ratio|nvidia_gpu_memory_used_bytes|nvidia_gpu_memory_free_bytes|nvidia_gpu_power_usage_watts|nvidia_gpu_sm_clock_mhz|nvidia_gpu_memory_clock_mhz|DCGM_FI_DEV_GPU_TEMP|DCGM_FI_DEV_FB_USED|DCGM_FI_DEV_FB_FREE|DCGM_FI_DEV_POWER_USAGE|DCGM_FI_DEV_SM_CLOCK|DCGM_FI_DEV_MEM_CLOCK)
                  source_labels:
                    - __name__
              metrics_path: /metrics
              relabel_configs:
                - action: keep
                  regex: ^nvidia-dcgm-exporter.*$
                  source_labels:
                    - __meta_kubernetes_pod_name
                - action: replace
                  regex: ([^:]+)(?::\d+)?
                  replacement: $1:9400
                  source_labels:
                    - __address__
                  target_label: __address__
                - action: replace
                  source_labels:
                    - __meta_kubernetes_pod_node_name
                  target_label: node
                - action: replace
                  regex: DCGM_FI_DEV_GPU_TEMP
                  replacement: nvidia_gpu_temperature_celsius
                  source_labels:
                    - __name__
                  target_label: __name__
                - action: replace
                  regex: DCGM_FI_DEV_GPU_UTIL
                  replacement: nvidia_gpu_utilization_ratio
                  source_labels:
                    - __name__
                  target_label: __name__
                - action: replace
                  regex: DCGM_FI_DEV_MEM_COPY_UTIL
                  replacement: nvidia_gpu_memory_utilization_ratio
                  source_labels:
                    - __name__
                  target_label: __name__
                - action: replace
                  regex: DCGM_FI_DEV_FB_USED
                  replacement: nvidia_gpu_memory_used_bytes
                  source_labels:
                    - __name__
                  target_label: __name__
                - action: replace
                  regex: DCGM_FI_DEV_FB_FREE
                  replacement: nvidia_gpu_memory_free_bytes
                  source_labels:
                    - __name__
                  target_label: __name__
                - action: replace
                  regex: DCGM_FI_DEV_POWER_USAGE
                  replacement: nvidia_gpu_power_usage_watts
                  source_labels:
                    - __name__
                  target_label: __name__
                - action: replace
                  regex: DCGM_FI_DEV_SM_CLOCK
                  replacement: nvidia_gpu_sm_clock_mhz
                  source_labels:
                    - __name__
                  target_label: __name__
                - action: replace
                  regex: DCGM_FI_DEV_MEM_CLOCK
                  replacement: nvidia_gpu_memory_clock_mhz
                  source_labels:
                    - __name__
                  target_label: __name__
                - action: replace
                  source_labels:
                    - __meta_kubernetes_pod_label_app
                  target_label: component
                - action: replace
                  replacement: rhoai-accelerator-metrics
                  target_label: job
              scrape_interval: 30s
              scrape_timeout: 10s
              tls_config:
                insecure_skip_verify: true
    service:
      extensions:
        - bearertokenauth
      pipelines:
        metrics:
          exporters:
            - prometheus
          processors:
            - memory_limiter
            - k8sattributes
            - resourcedetection
            - batch
          receivers:
            - prometheus
            - otlp
        traces:
          exporters:
            - otlp/tempo
          processors:
            - memory_limiter
            - k8sattributes
            - resourcedetection
            - batch
          receivers:
            - otlp
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
  configVersions: 3
  daemonSetUpdateStrategy: {}
  deploymentUpdateStrategy: {}
  httpRoute:
    enabled: false
    gateway: ""
  ingress:
    route: {}
  ipFamilyPolicy: SingleStack
  managementState: managed
  mode: statefulset
  networkPolicy:
    enabled: true
  observability:
    metrics: {}
  podDnsConfig: {}
  replicas: 2
  resources:
    limits:
      cpu: "1"
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 256Mi
  targetAllocator:
    allocationStrategy: consistent-hashing
    collectorNotReadyGracePeriod: 30s
    collectorTargetReloadInterval: 30s
    enabled: true
    filterStrategy: relabel-config
    observability:
      metrics: {}
    prometheusCR:
      enabled: true
      evaluationInterval: 30s
      podMonitorNamespaceSelector: {}
      podMonitorSelector:
        matchLabels:
          opendatahub.io/monitoring: "true"
      probeNamespaceSelector: {}
      scrapeConfigNamespaceSelector: {}
      scrapeInterval: 30s
      serviceMonitorNamespaceSelector: {}
      serviceMonitorSelector:
        matchLabels:
          opendatahub.io/monitoring: "true"
    replicas: 1
    resources: {}
    serviceAccount: data-science-collector-collector
  upgradeStrategy: automatic
  volumeMounts:
    - mountPath: /etc/otel-collector/tls
      name: tls-certs
      readOnly: true
  volumes:
    - name: tls-certs
      secret:
        secretName: data-science-collector-tls
