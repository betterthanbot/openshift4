apiVersion: v1
data:
  deployment: |
    spec:
      replicas: 2
      template:
        spec:
          containers:
          - name: istio-proxy
            resources:
              requests:
                memory: 256Mi
              limits:
                memory: 3Gi
  podDisruptionBudget: |
    spec:
      minAvailable: 1
kind: ConfigMap
metadata:
  name: maas-default-gateway-options
  namespace: openshift-ingress
