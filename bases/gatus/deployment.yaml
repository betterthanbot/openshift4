---
# ==========================================
# 3. DEPLOYMENT (The Gatus App)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  labels:
    app: gatus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gatus
  strategy:
    type: Recreate 
  template:
    metadata:
      labels:
        app: gatus
    spec:
      containers:
        - name: gatus
          image: twinproduction/gatus:latest
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: config-volume
              mountPath: /config/config.yaml
              subPath: config.yaml
            - name: data-volume
              mountPath: /data
      volumes:
        - name: config-volume
          configMap:
            name: gatus-config
        - name: data-volume
          persistentVolumeClaim:
            claimName: gatus-data-pvc