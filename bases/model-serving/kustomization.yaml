# ==============================================================================
# bases/model-serving
#
# Everything that was hand-created in the `vllm-project` namespace on the source
# cluster to serve models through Models-as-a-Service, captured as code.
#
# Depends on (all under operators/bases):
#   maas/gateway.yaml        — the maas-default-gateway these models attach to
#   maas/tenant.yaml         — MaaS control plane
#   maas/subscriptions.yaml  — token budgets naming these exact model names
#   rhoai/datasciencecluster.yaml: components.kserve.modelsAsService = Managed
#
# NOT included here, because a controller owns each of them and will recreate
# them from the CRs that ARE here:
#   AuthPolicy maas-auth-*            TokenRateLimitPolicy maas-trlp-*
#   HTTPRoute  *-kserve-route         MaaSModelRef *
#   InferencePool *-inference-pool    Deployment/Service *-kserve*, *-epp-service
# ==============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vllm-project

# Nearly every kind here — serving.kserve.io (LLMInferenceService,
# LLMInferenceServiceConfig, InferenceService, ServingRuntime) and
# llamastack.io/LlamaStackDistribution — has its CRD registered by the RHOAI
# DataScienceCluster, which lives in operators/bases/rhoai. Until that has
# reconciled, ArgoCD cannot resolve these kinds, and it rejects the WHOLE
# Application sync up front rather than the individual resources.
#
# Applied to every resource in the base (harmless on the Secrets / Service /
# ServiceMonitor / HTTPRoute, whose kinds always exist) so the app degrades into
# a retry instead of a hard failure. See techdebt.md #14.
commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

resources:
  - connections.yaml
  - llminferenceserviceconfigs.yaml
  - llminferenceservices.yaml
  - classic-serving.yaml
  - body-based-routes.yaml
  - metrics.yaml
  - llamastack-playground.yaml

configMapGenerator:
  # Inference providers for the Gen AI playground. Kept as a real file so it can
  # be edited/diffed like YAML rather than as an escaped blob.
  - name: llama-stack-config
    files:
      - config.yaml=llama-stack-config.yaml
    options:
      disableNameSuffixHash: true

  # Per-model metrics panel definitions rendered by the RHOAI dashboard's
  # model "Metrics" tab. `supported: "true"` is what makes the tab appear.
  - name: llama-32-1b-instruct-metrics-dashboard
    files:
      - metrics=metrics-dashboard.json
    literals:
      - supported=true
    options:
      disableNameSuffixHash: true
