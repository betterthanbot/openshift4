# ==============================================================================
# Model "connections" — the RHOAI dashboard's term for a Secret that holds a
# model's storage location.
#
# Referenced by the opendatahub.io/connections annotation on each
# LLMInferenceService / InferenceService. Contents are just a public OCI
# modelcar image reference — no credentials — so they are safe in git.
#
# These are Opaque Secrets rather than ConfigMaps because that is the shape the
# dashboard expects; a connection can also carry S3 keys, hence Secret.
# ==============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: llama-32-1b-instruct-maas
  namespace: vllm-project
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    opendatahub.io/connection-type-protocol: uri
    opendatahub.io/connection-type-ref: uri-v1
    openshift.io/display-name: llama-3.2-1b-instruct-maas
type: Opaque
stringData:
  URI: oci://quay.io/redhat-ai-services/modelcar-catalog:llama-3.2-1b-instruct
