# ==============================================================================
# vLLM metrics scraping.
#
# monitoring.opendatahub.io/scrape: "true" on the ServiceMonitor is what makes
# the RHOAI OpenTelemetry collector (data-science-collector in
# redhat-ods-monitoring) pick it up, so these metrics land in the RHOAI Thanos
# that the "Prometheus (Data Science)" Grafana datasource queries — not in the
# cluster's default monitoring stack.
#
# The Service selects on serving.kserve.io/inferenceservice, i.e. the classic
# InferenceService pods in classic-serving.yaml. LLMInferenceService pods are
# scraped by RHOAI's own kserve-llm-isvc-scheduler ServiceMonitors instead.
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  labels:
    monitoring.opendatahub.io/scrape: "true"
    name: llama-32-1b-instruct-metrics
  name: llama-32-1b-instruct-metrics
  namespace: vllm-project
spec:
  ports:
    - name: llama-32-1b-instruct-metrics
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    serving.kserve.io/inferenceservice: llama-32-1b-instruct
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    monitoring.opendatahub.io/scrape: "true"
  name: llama-32-1b-instruct-metrics
  namespace: vllm-project
spec:
  endpoints:
    - port: llama-32-1b-instruct-metrics
      scheme: http
  namespaceSelector: {}
  selector:
    matchLabels:
      name: llama-32-1b-instruct-metrics
