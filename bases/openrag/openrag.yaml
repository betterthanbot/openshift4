# Source: openrag/templates/backend/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openrag-backend
  namespace: openrag
  labels:
    helm.sh/chart: openrag-0.2.0
    app.kubernetes.io/name: openrag
    app.kubernetes.io/instance: openrag
    app.kubernetes.io/version: "0.1.52"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: backend
spec:
  replicas: 1  # Single pod for vertical scaling
  strategy:
    type: Recreate  # Required for RWO PVCs
  selector:
    matchLabels:
      app.kubernetes.io/name: openrag
      app.kubernetes.io/instance: openrag
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openrag
        app.kubernetes.io/instance: openrag
        app.kubernetes.io/component: backend
      annotations:
        checksum/secret-opensearch: b062e8775d678cdad819ddb6c8f6bb07e1707abdc213751689b0d8728abd4d5e
        checksum/secret-langflow: 122b69a0784d5d8e260f8e8eaefbaf985ecbc58fa988b2c8ac457df63b1ad414
        checksum/config-flows: e7f093f3764a86d758bcea4831a2cc07374161bdbe38111c55b87cfda93f6523
        checksum/config-app: 09bfd635cb3a63710203d2e20f3d7adb507a44dc6e7b690c7f8f2a30f855e7b1
        checksum/secret-backend: c92357bc747a5ad4f060f85ff7d258c821cd455d52959cb79c68442444e27abc
        checksum/secret-dotenv: a8d54a32907634ed6bde897794aee3974cc1feed6ad92efd025211e929f6e688
    spec:
      serviceAccountName: openrag
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
      initContainers:
        - name: load-default-documents
          image: curlimages/curl:8.5.0
          resources:
            limits:
              ephemeral-storage: 500Mi
            requests:
              ephemeral-storage: 500Mi
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              DOCS_DIR="/shared/openrag-documents"

              OWNER="langflow-ai"
              REPO="openrag"
              BRANCH="main"
              GIT_REF="a1d691b9ef6ef9154d83c8a3565c23d185c06f8e"
              REPO_PATH="openrag-documents"

              # Raw base URL: https://raw.githubusercontent.com/<owner>/<repo>/<ref>/<path>
              GITHUB_RAW_URL="https://raw.githubusercontent.com/${OWNER}/${REPO}/${GIT_REF}/${REPO_PATH}"

              mkdir -p "$DOCS_DIR"

              if [ -z "$(ls -A "$DOCS_DIR" 2>/dev/null)" ]; then
                echo "Loading default documents from ${OWNER}/${REPO}@${GIT_REF}/${REPO_PATH} ..."

                download_with_retry() {
                  file="$1"
                  url="${GITHUB_RAW_URL}/${file}"
                  dest="${DOCS_DIR}/${file}"
                  max_retries=3
                  timeout=60
                  retry=0

                  while [ "$retry" -lt "$max_retries" ]; do
                    echo "Downloading ${file} (attempt $((retry + 1))/${max_retries})..."
                    if curl -f -L -m "$timeout" -o "$dest" "$url"; then
                      echo "OK: ${file}"
                      return 0
                    fi
                    retry=$((retry + 1))
                    if [ "$retry" -lt "$max_retries" ]; then
                      echo "Retrying ${file}..."
                      sleep 2
                    fi
                  done

                  echo "ERROR: Failed to download ${file} from ${url}"
                  return 1
                }

                failed=0
                if ! download_with_retry "docling.pdf"; then failed=1; fi
                if ! download_with_retry "ibm_anthropic.pdf"; then failed=1; fi
                if ! download_with_retry "openrag-documentation.pdf"; then failed=1; fi
                if ! download_with_retry "warmup_ocr.pdf"; then failed=1; fi

                if [ "$failed" -eq 1 ]; then
                  echo "ERROR: One or more documents failed to download"
                  exit 1
                fi

                echo "Documents loaded: $(ls "$DOCS_DIR")"
              else
                echo "Documents already exist in $DOCS_DIR, skipping download."
              fi
          volumeMounts:
            - name: shared
              mountPath: "/shared"
        - name: load-default-flows
          image: curlimages/curl:8.5.0
          resources:
            limits:
              ephemeral-storage: 500Mi
            requests:
              ephemeral-storage: 500Mi
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              FLOWS_DIR="/shared/flows"

              OWNER="langflow-ai"
              REPO="openrag"
              BRANCH="main"
              GIT_REF="a1d691b9ef6ef9154d83c8a3565c23d185c06f8e"
              REPO_PATH="flows"

              # Raw base URL: https://raw.githubusercontent.com/<owner>/<repo>/<ref>/<path>
              GITHUB_RAW_URL="https://raw.githubusercontent.com/${OWNER}/${REPO}/${GIT_REF}/${REPO_PATH}"

              mkdir -p "$FLOWS_DIR"

              if [ -z "$(ls -A "$FLOWS_DIR" 2>/dev/null)" ]; then
                echo "Loading default flows from ${OWNER}/${REPO}@${GIT_REF}/${REPO_PATH} ..."

                download_with_retry() {
                  file="$1"
                  url="${GITHUB_RAW_URL}/${file}"
                  dest="${FLOWS_DIR}/${file}"
                  max_retries=3
                  timeout=60
                  retry=0

                  while [ "$retry" -lt "$max_retries" ]; do
                    echo "Downloading ${file} (attempt $((retry + 1))/${max_retries})..."
                    if curl -f -L -m "$timeout" -o "$dest" "$url"; then
                      echo "OK: ${file}"
                      return 0
                    fi
                    retry=$((retry + 1))
                    if [ "$retry" -lt "$max_retries" ]; then
                      echo "Retrying ${file}..."
                      sleep 2
                    fi
                  done

                  echo "ERROR: Failed to download ${file} from ${url}"
                  return 1
                }

                failed=0
                if ! download_with_retry "ingestion_flow.json"; then failed=1; fi
                if ! download_with_retry "openrag_agent.json"; then failed=1; fi
                if ! download_with_retry "openrag_nudges.json"; then failed=1; fi
                if ! download_with_retry "openrag_url_mcp.json"; then failed=1; fi

                if [ "$failed" -eq 1 ]; then
                  echo "ERROR: One or more flows failed to download"
                  exit 1
                fi

                echo "Flows loaded: $(ls "$FLOWS_DIR")"
              else
                echo "Flows already exist in $FLOWS_DIR, skipping download."
              fi
          volumeMounts:
            - name: shared
              mountPath: "/shared"
        - name: wait-for-langflow
          image: busybox:1.36
          resources:
            limits:
              ephemeral-storage: 10Mi
            requests:
              ephemeral-storage: 10Mi
          command:
            - sh
            - -c
            - |
              echo "Waiting for Langflow to be ready..."
              until nc -z openrag-langflow 7860; do
                echo "Langflow not ready, sleeping 5s..."
                sleep 5
              done
              echo "Langflow is ready!"
      containers:
        - name: backend
          image: "langflowai/openrag-backend:0.8.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsGroup: 1000
            runAsUser: 1000
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: openrag-dotenv
              mountPath: /app/.env
              subPath: .env
              readOnly: true
            - name: data
              mountPath: "/data"
            - name: shared
              mountPath: "/shared"
              readOnly: true
          resources:
            limits:
              cpu: "4"
              ephemeral-storage: 2Gi
              memory: 16Gi
            requests:
              cpu: 500m
              ephemeral-storage: 1Gi
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  FAILED=0

                  # Langflow health
                  echo "Checking Langflow..."
                  if ! curl -sf "http://openrag-langflow:7860/health" >/dev/null 2>&1; then
                    echo "ERROR: Langflow health check failed at http://openrag-langflow:7860/health"
                    FAILED=1
                  else
                    echo "Langflow: OK"
                  fi

                  echo "All health checks passed"
                  exit 0
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: openrag-dotenv
          secret:
            secretName: openrag-dotenv
            defaultMode: 0400
            items:
              - key: .env
                path: .env
        - name: data
          persistentVolumeClaim:
            claimName: openrag-data
        - name: shared
          persistentVolumeClaim:
            claimName: openrag-shared
