apiVersion: apps/v1
kind: Deployment
metadata:
  name: openrag-frontend
  namespace: openrag
  labels:
    helm.sh/chart: openrag-0.2.0
    app.kubernetes.io/name: openrag
    app.kubernetes.io/instance: openrag
    app.kubernetes.io/version: "0.1.52"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openrag
      app.kubernetes.io/instance: openrag
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openrag
        app.kubernetes.io/instance: openrag
        app.kubernetes.io/component: frontend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: openrag
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: frontend
          image: "langflowai/openrag-frontend:0.8.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsGroup: 1000
            runAsUser: 1000
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            # Backend connection (uses internal service name)
            - name: OPENRAG_BACKEND_HOST
              value: "openrag-backend"
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
