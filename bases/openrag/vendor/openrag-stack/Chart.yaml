apiVersion: v2
appVersion: 2.3.3
dependencies:
- alias: kuberay
  condition: kuberay.enabled
  name: kuberay-operator
  repository: https://ray-project.github.io/kuberay-helm/
  version: 1.4.0
- condition: postgresql.enabled
  name: postgresql
  repository: https://charts.bitnami.com/bitnami
  version: '>=17.6.0 <19.0.0'
- condition: milvus.enabled
  name: milvus
  repository: https://zilliztech.github.io/milvus-helm/
  version: 5.0.27
- alias: vllm
  condition: vllm.enabled
  name: vllm-stack
  repository: https://vllm-project.github.io/production-stack
  version: '>=0.1.12 <1.0.0'
- alias: kubePrometheusStack
  condition: monitoring.bundled
  name: kube-prometheus-stack
  repository: https://prometheus-community.github.io/helm-charts
  version: 91.4.1
description: A Helm chart for Kubernetes
home: https://github.com/linagora/openrag
maintainers:
- email: openrag@linagora.com
  name: linagora
  url: https://github.com/linagora/openrag
name: openrag-stack
sources:
- https://github.com/linagora/openrag
type: application
version: 0.7.10
