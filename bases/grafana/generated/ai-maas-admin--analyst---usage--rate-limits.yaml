apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ai-maas-admin--analyst---usage--rate-limits
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-a
  datasources:
    - inputName: "DS_PROMETHEUS"
      datasourceName: "Prometheus"
  json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Consolidated MaaS usage & rate-limit accounting for MaaS admins and analysts: who's using the platform, how much, and how close to their limits. Replaces 'RHOAI MaaS Group Monitoring', 'RHOAI MaaS Group Monitoring (Detailed)', 'RHOAI MaaS Usage Overview', and 'RHOAI MaaS Per-User Token Usage' — all four sliced the same Limitador request/token accounting data with overlapping panels. Built once authorized_calls/authorized_hits/limited_calls confirmed live with real user/subscription/cost_center/organization_id labels (2026-07-26; previously these had zero active series). Note: authorized_calls has NO limit_name label in this Limitador build (only limited_calls does) — group breakdowns here use `subscription` instead, fixing a broken filter that silently no-op'd in the dashboard this replaces.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 100,
          "panels": [],
          "title": "Overview",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(increase(authorized_calls{user=~\"$user\",subscription=~\"$subscription\"}[$__range]))",
              "legendFormat": "requests",
              "refId": "A"
            }
          ],
          "title": "Total Requests",
          "type": "stat",
          "description": "Requests that passed Kuadrant/Limitador's rate-limit checks.",
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 0,
            "y": 1
          },
          "id": 1
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(increase(authorized_hits{user=~\"$user\",subscription=~\"$subscription\"}[$__range]))",
              "legendFormat": "tokens",
              "refId": "A"
            }
          ],
          "title": "Total Tokens",
          "type": "stat",
          "description": "Token count reported by Limitador per completed request (authorized_hits).",
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 5,
            "y": 1
          },
          "id": 2
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(increase(limited_calls{user=~\"$user\",subscription=~\"$subscription\"}[$__range]))",
              "legendFormat": "rejected",
              "refId": "A"
            }
          ],
          "title": "Rejected Requests",
          "type": "stat",
          "description": "Requests rejected by a tier request-rate limit or a per-model token-rate limit.",
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 10,
            "y": 1
          },
          "id": 3
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "orange",
                    "value": 10
                  },
                  {
                    "color": "red",
                    "value": 30
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "100 * sum(increase(limited_calls{user=~\"$user\",subscription=~\"$subscription\"}[$__range])) / (sum(increase(limited_calls{user=~\"$user\",subscription=~\"$subscription\"}[$__range])) + sum(increase(authorized_calls{user=~\"$user\",subscription=~\"$subscription\"}[$__range])))",
              "legendFormat": "__auto",
              "refId": "A"
            }
          ],
          "title": "Rejection Rate %",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 15,
            "y": 1
          },
          "id": 4
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "count(count by (user) (authorized_calls{user=~\"$user\",subscription=~\"$subscription\"}))",
              "legendFormat": "__auto",
              "refId": "A"
            }
          ],
          "title": "Active Users",
          "type": "stat",
          "description": "Distinct users with at least one request in the selected time range.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "id": 5
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "id": 101,
          "panels": [],
          "title": "Active Users Over Time",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "count(count by (user) (increase(authorized_calls{user=~\"$user\",subscription=~\"$subscription\"}[1h])))",
              "legendFormat": "active users",
              "refId": "A"
            }
          ],
          "title": "Active Users (Distinct, Trailing 1h Window)",
          "type": "timeseries",
          "description": "How many distinct users hit the gateway in the trailing hour, at each point in the selected range — use a 7d range to see day/week usage patterns.",
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 7
          },
          "id": 6
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "id": 102,
          "panels": [],
          "title": "Requests & Rejections by Group",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "normal"
                }
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum by (subscription) (rate(authorized_calls{user=~\"$user\",subscription=~\"$subscription\"}[5m])) * 60",
              "legendFormat": "{{subscription}}",
              "refId": "A"
            }
          ],
          "title": "Authorized Requests/min by Subscription",
          "type": "timeseries",
          "description": "Grouped by subscription — whatever tier/group names exist on this cluster (sourced live from the Subscription/Group variable, not hardcoded).",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 17
          },
          "id": 7
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "normal"
                }
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum by (subscription) (rate(limited_calls{user=~\"$user\",subscription=~\"$subscription\"}[5m])) * 60",
              "legendFormat": "{{subscription}}",
              "refId": "A"
            }
          ],
          "title": "Rejected Requests/min by Subscription",
          "type": "timeseries",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 17
          },
          "id": 8
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "fillOpacity": 80,
                "lineWidth": 1
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "barWidth": 0.6,
            "fullHighlight": false,
            "groupWidth": 0.7,
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": false
            },
            "orientation": "horizontal",
            "showValue": "auto",
            "stacking": "none",
            "tooltip": {
              "mode": "single"
            },
            "xTickLabelRotation": 0,
            "xTickLabelSpacing": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum by (limit_name) (increase(limited_calls{limit_name=~\".*-tokens\",user=~\"$user\",subscription=~\"$subscription\"}[$__range]))",
              "legendFormat": "{{limit_name}}",
              "refId": "A"
            }
          ],
          "title": "Token-Limit Hits by Group + Model (Total)",
          "type": "barchart",
          "description": "Limit names encode group + model, e.g. models-as-a-service-<subscription>-<model>-tokens (exact naming depends on how TokenRateLimitPolicy objects are named on this cluster).",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 26
          },
          "id": 9
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 34
          },
          "id": 103,
          "panels": [],
          "title": "Token Usage by User",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "cellHeight": "sm",
            "footer": {
              "countRows": false,
              "fields": "",
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum by (user, subscription, model) (increase(authorized_hits{user=~\"$user\",subscription=~\"$subscription\"}[$__range]))",
              "format": "table",
              "instant": true,
              "legendFormat": "__auto",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum by (user, subscription) (increase(authorized_calls{user=~\"$user\",subscription=~\"$subscription\"}[$__range]))",
              "format": "table",
              "instant": true,
              "legendFormat": "__auto",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum by (user, subscription) (increase(limited_calls{user=~\"$user\",subscription=~\"$subscription\"}[$__range]))",
              "format": "table",
              "instant": true,
              "legendFormat": "__auto",
              "refId": "C"
            }
          ],
          "title": "Token Consumption by User",
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value #A": "tokens",
                  "Value #B": "requests",
                  "Value #C": "rejected",
                  "model": "model"
                }
              }
            }
          ],
          "type": "table",
          "description": "tokens comes from authorized_hits (carries a model label); requests/rejected come from authorized_calls/limited_calls (no model label in this Limitador build) so those rows show a blank model.",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 35
          },
          "id": 10
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 45
          },
          "id": 104,
          "panels": [],
          "title": "Rate Limits & Token Limits",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(rate(authorized_calls{subscription=\"$subscription\"}[1m])) * 60",
              "legendFormat": "__auto",
              "refId": "A"
            }
          ],
          "title": "Request Rate — $subscription",
          "type": "stat",
          "description": "One tile per subscription (driven by the Subscription/Group variable above, so it tracks whatever tenant/group names this cluster actually has — set that variable to 'All' to see every group). Compare against your RateLimitPolicy's configured request-rate limit; Prometheus has no metric for the configured threshold itself, so it can't be drawn as a gauge max here — see the reference panel below.",
          "repeat": "subscription",
          "repeatDirection": "h",
          "gridPos": {
            "h": 7,
            "w": 6,
            "x": 0,
            "y": 46
          },
          "id": 11
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(rate(authorized_hits{subscription=\"$subscription\"}[1m])) * 60",
              "legendFormat": "__auto",
              "refId": "A"
            }
          ],
          "title": "Token Rate — $subscription",
          "type": "stat",
          "description": "Same as Request Rate, but token throughput — compare against your TokenRateLimitPolicy's configured limit.",
