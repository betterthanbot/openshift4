apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: admin-vpa-table
  namespace: openshift-operators
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-a
  json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": 0,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 10,
          "panels": [],
          "title": "VPA Adoption & Configuration Summary",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 5,
            "x": 0,
            "y": 1
          },
          "id": 12,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "12.3.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "count(kube_customresource_verticalpodautoscaler_spec_updatepolicy_updatemode{namespace=~\"$namespace\"})/4",
              "legendFormat": "Active VPAs",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Total VPAs",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": 0
                  },
                  {
                    "color": "orange",
                    "value": 50
                  },
                  {
                    "color": "green",
                    "value": 80
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 7,
            "x": 5,
            "y": 1
          },
          "id": 14,
          "options": {
            "minVizHeight": 75,
            "minVizWidth": 75,
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "sizing": "auto"
          },
          "pluginVersion": "12.3.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "(count(kube_customresource_verticalpodautoscaler_spec_updatepolicy_updatemode{namespace=~\"$namespace\"})/4) / count(kube_deployment_status_observed_generation) * 100",
              "legendFormat": "Deployment Coverage",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "VPA Coverage % (vs Deployments)",
          "type": "gauge"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                }
              },
              "mappings": [],
              "unit": "none"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Auto"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": "green"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Off"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": "red"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Initial"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": "orange"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Recreate"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": "blue"
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "id": 16,
          "options": {
            "displayLabels": [
              "name",
              "percent"
            ],
            "legend": {
              "calcs": [
                "percent",
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "values": [
                "percent",
                "value"
              ]
            },
            "pieType": "pie",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "sort": "desc",
            "tooltip": {
              "hideZeros": false,
              "mode": "single",
              "sort": "none"
            }
          },
          "pluginVersion": "12.3.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "builder",
              "expr": "sum by (updateMode) (kube_customresource_verticalpodautoscaler_spec_updatepolicy_updatemode{namespace=~\"$namespace\"})",
              "format": "time_series",
              "instant": true,
              "legendFormat": "{{updateMode}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "VPA Update Mode Distribution",
          "type": "piechart"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 7
          },
          "id": 20,
          "panels": [],
          "title": "Detailed Analysis",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "footer": {
                  "reducers": []
                },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".*CPU.*"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "cpu"
                  },
                  {
                    "id": "decimals",
                    "value": 3
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".*Mem.*"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 20,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "id": 2,
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "sortBy": [
              {
                "desc": false,
                "displayName": "Namespace"
              }
            ]
          },
          "pluginVersion": "12.3.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (namespace, verticalpodautoscaler, container) (kube_customresource_verticalpodautoscaler_status_recommendation_containerrecommendations_lowerbound_cpu{namespace=~\"$namespace\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "VPA Min (CPU)",
              "range": false,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (namespace, verticalpodautoscaler, container) (kube_customresource_verticalpodautoscaler_status_recommendation_containerrecommendations_target_cpu{namespace=~\"$namespace\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "VPA Target (CPU)",
              "range": false,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (namespace, verticalpodautoscaler, container) (kube_customresource_verticalpodautoscaler_status_recommendation_containerrecommendations_upperbound_cpu{namespace=~\"$namespace\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "VPA Max (CPU)",
              "range": false,
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (namespace, verticalpodautoscaler, container) (kube_customresource_verticalpodautoscaler_status_recommendation_containerrecommendations_lowerbound_memory{namespace=~\"$namespace\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "VPA Min (Mem)",
              "range": false,
              "refId": "D"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (namespace, verticalpodautoscaler, container) (kube_customresource_verticalpodautoscaler_status_recommendation_containerrecommendations_target_memory{namespace=~\"$namespace\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "VPA Target (Mem)",
              "range": false,
              "refId": "E"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (namespace, verticalpodautoscaler, container) (kube_customresource_verticalpodautoscaler_status_recommendation_containerrecommendations_upperbound_memory{namespace=~\"$namespace\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "VPA Max (Mem)",
              "range": false,
              "refId": "F"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "avg by (namespace, verticalpodautoscaler, container) (label_replace(kube_pod_container_resource_requests{resource=\"cpu\", namespace=~\"$namespace\"}, \"verticalpodautoscaler\", \"$1\", \"pod\", \"(.*)-[a-z0-9]+-[a-z0-9]+\"))",
              "format": "table",
              "instant": true,
              "legendFormat": "Actual Request (CPU)",
              "range": false,
              "refId": "G"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "avg by (namespace, verticalpodautoscaler, container) (label_replace(kube_pod_container_resource_limits{resource=\"cpu\", namespace=~\"$namespace\"}, \"verticalpodautoscaler\", \"$1\", \"pod\", \"(.*)-[a-z0-9]+-[a-z0-9]+\"))",
              "format": "table",
              "instant": true,
              "legendFormat": "Actual Limit (CPU)",
              "range": false,
              "refId": "H"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "avg by (namespace, verticalpodautoscaler, container) (label_replace(kube_pod_container_resource_requests{resource=\"memory\", namespace=~\"$namespace\"}, \"verticalpodautoscaler\", \"$1\", \"pod\", \"(.*)-[a-z0-9]+-[a-z0-9]+\"))",
              "format": "table",
              "instant": true,
              "legendFormat": "Actual Request (Mem)",
              "range": false,
              "refId": "I"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "avg by (namespace, verticalpodautoscaler, container) (label_replace(kube_pod_container_resource_limits{resource=\"memory\", namespace=~\"$namespace\"}, \"verticalpodautoscaler\", \"$1\", \"pod\", \"(.*)-[a-z0-9]+-[a-z0-9]+\"))",
              "format": "table",
              "instant": true,
              "legendFormat": "Actual Limit (Mem)",
              "range": false,
              "refId": "J"
            }
          ],
          "title": "VPA Recommendations vs Actual Provisioning",
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "container",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 10": true,
                  "Time 2": true,
                  "Time 3": true,
                  "Time 4": true,
                  "Time 5": true,
                  "Time 6": true,
                  "Time 7": true,
                  "Time 8": true,
                  "Time 9": false,
                  "container 1": true,
                  "container 2": true,
                  "container 3": true,
                  "container 4": true,
                  "container 5": true,
                  "container 6": true,
                  "container 7": true,
                  "container 8": true,
                  "container 9": true,
                  "namespace 1": false,
                  "namespace 10": true,
                  "namespace 2": true,
                  "namespace 3": true,
                  "namespace 4": true,
                  "namespace 5": true,
                  "namespace 6": true,
                  "namespace 7": true,
                  "namespace 8": true,
                  "namespace 9": true,
                  "verticalpodautoscaler 1": false,
                  "verticalpodautoscaler 10": true,
                  "verticalpodautoscaler 2": true,
                  "verticalpodautoscaler 3": true,
                  "verticalpodautoscaler 4": true,
                  "verticalpodautoscaler 5": true,
                  "verticalpodautoscaler 6": true,
                  "verticalpodautoscaler 7": true,
                  "verticalpodautoscaler 8": true,
                  "verticalpodautoscaler 9": true
                },
                "includeByName": {},
                "indexByName": {
                  "Time 1": 6,
                  "Time 10": 38,
                  "Time 2": 17,
                  "Time 3": 20,
                  "Time 4": 23,
                  "Time 5": 26,
                  "Time 6": 29,
                  "Time 7": 32,
                  "Time 8": 35,
                  "Time 9": 2,
                  "Value #A": 9,
                  "Value #B": 10,
                  "Value #C": 11,
                  "Value #D": 14,
                  "Value #E": 15,
                  "Value #F": 16,
                  "Value #G": 7,
                  "Value #H": 8,
                  "Value #I": 12,
                  "Value #J": 13,
                  "container": 5,
                  "namespace 1": 3,
                  "namespace 10": 39,
                  "namespace 2": 18,
                  "namespace 3": 21,
                  "namespace 4": 24,
                  "namespace 5": 27,
                  "namespace 6": 30,
                  "namespace 7": 33,
                  "namespace 8": 36,
                  "namespace 9": 0,
                  "verticalpodautoscaler 1": 4,
                  "verticalpodautoscaler 10": 40,
                  "verticalpodautoscaler 2": 19,
                  "verticalpodautoscaler 3": 22,
                  "verticalpodautoscaler 4": 25,
                  "verticalpodautoscaler 5": 28,
                  "verticalpodautoscaler 6": 31,
                  "verticalpodautoscaler 7": 34,
                  "verticalpodautoscaler 8": 37,
                  "verticalpodautoscaler 9": 1
                },
                "renameByName": {
                  "Value #A": "VPA Min (CPU)",
                  "Value #B": "VPA Target (CPU)",
                  "Value #C": "VPA Max (CPU)",
                  "Value #D": "VPA Min (Mem)",
                  "Value #E": "VPA Target (Mem)",
                  "Value #F": "VPA Max (Mem)",
                  "Value #G": "Actual Request (CPU)",
                  "Value #H": "Actual Limit (CPU)",
                  "Value #I": "Actual Request (Mem)",
                  "Value #J": "Actual Limit (Mem)",
                  "container": "Container",
                  "namespace": "Namespace",
                  "verticalpodautoscaler": "Deployment Name",
                  "verticalpodautoscaler 10": ""
                }
              }
            }
          ],
          "type": "table"
        }
      ],
      "preload": false,
      "refresh": "10s",
      "schemaVersion": 42,
      "tags": [
        "vpa",
        "autoscaling"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "text": "prometheus",
              "value": "ffb6gga7bpibkc"
            },
            "description": "Select Datasource",
            "includeAll": false,
            "label": "Datasource",
            "name": "DS_PROMETHEUS",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "type": "datasource"
          },
          {
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "definition": "label_values(kube_customresource_verticalpodautoscaler_status_recommendation_containerrecommendations_target_cpu, namespace)",
            "description": "Namespace",
            "includeAll": true,
            "label": "Namespace",
            "multi": true,
            "name": "namespace",
            "options": [],
            "query": {
              "query": "label_values(kube_customresource_verticalpodautoscaler_status_recommendation_containerrecommendations_target_cpu, namespace)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 1,
            "regex": "",
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "Admin: VPA Table",
      "uid": "roddkhn",
      "version": 2
    }