                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
