          "pluginVersion": "10.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "avg(DCGM_FI_DEV_GPU_UTIL{namespace=\"$namespace\", pod=~\"$pod\"})",
              "legendFormat": "__auto",
