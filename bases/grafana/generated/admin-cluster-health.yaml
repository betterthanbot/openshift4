              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum(node_memory_MemTotal_bytes) - sum(node_memory_MemAvailable_bytes)",
              "legendFormat": "Actual Memory Usage",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum(kube_pod_container_resource_requests{resource=\"memory\"})",
              "legendFormat": "Memory Requested",
              "range": true,
              "refId": "C"
            }
          ],
          "title": "💾 Cluster Memory — Capacity vs Usage vs Requested",
          "type": "timeseries"
        },
