apiVersion: apps/v1
kind: Deployment
metadata:
  name: litemaas-backend
  labels:
    helm.sh/chart: litemaas-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: litemaas
    app.kubernetes.io/version: "0.3.1"
    app.kubernetes.io/name: litemaas
    app.kubernetes.io/instance: litemaas
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litemaas
      app.kubernetes.io/instance: litemaas
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        helm.sh/chart: litemaas-0.1.0
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: litemaas
        app.kubernetes.io/version: "0.3.1"
        app.kubernetes.io/name: litemaas
        app.kubernetes.io/instance: litemaas
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: litemaas
      initContainers:
        - name: wait-for-database
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command:
            - sh
            - -c
            - |
              until psql "$DATABASE_URL" -c '\q' 2>/dev/null; do
                echo "Waiting for database..."
                sleep 2
              done
              echo "Database is ready!"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litemaas-backend
                  key: database-url
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      containers:
        - name: backend
          image: "quay.io/rh-aiservices-bu/litemaas-backend:0.3.1"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: litemaas-backend-config
          env:
            # Database Configuration
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litemaas-backend
                  key: database-url
            # CORS Configuration
            - name: CORS_ORIGIN
              valueFrom:
                secretKeyRef:
                  name: litemaas-backend
                  key: cors-origin
            # JWT Configuration
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: litemaas-backend
                  key: jwt-secret
            # OAuth Configuration
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: litemaas-backend
                  key: oauth-client-id
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: litemaas-oauth-token
                  key: token
            - name: OAUTH_ISSUER
              valueFrom:
                secretKeyRef:
                  name: litemaas-backend
                  key: oauth-issuer
            - name: OAUTH_CALLBACK_URL
              valueFrom:
                secretKeyRef:
                  name: litemaas-backend
                  key: oauth-callback-url
            # Admin Configuration
            - name: ADMIN_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: litemaas-backend
                  key: admin-api-keys
            # LiteLLM Integration
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litemaas-backend
                  key: litellm-api-key
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litemaas-backend
                  key: litellm-master-key
            # Backup & Restore — LiteLLM database direct connection
            - name: LITELLM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litemaas-backend
                  key: litellm-database-url
          volumeMounts:
            - name: backup-storage
              mountPath: /data/backups
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: backup-storage
          persistentVolumeClaim:
            claimName: litemaas-backend-backup
