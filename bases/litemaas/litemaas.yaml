apiVersion: apps/v1
kind: Deployment
metadata:
  name: litemaas
  labels:
    helm.sh/chart: litemaas-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: litemaas
    app.kubernetes.io/version: "0.3.1"
    app.kubernetes.io/name: litemaas
    app.kubernetes.io/instance: litemaas
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litemaas
      app.kubernetes.io/instance: litemaas
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        helm.sh/chart: litemaas-0.1.0
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: litemaas
        app.kubernetes.io/version: "0.3.1"
        app.kubernetes.io/name: litemaas
        app.kubernetes.io/instance: litemaas
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: litemaas
      initContainers:
        - name: wait-for-backend
          image: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for backend to be ready..."
              until nc -z litemaas-backend 8080; do
                echo "Backend is not ready yet. Waiting..."
                sleep 5
              done
              echo "Backend is ready! Starting frontend..."
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      containers:
        - name: frontend
          image: "quay.io/rh-aiservices-bu/litemaas-frontend:0.3.1"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: BACKEND_URL
              value: "http://litemaas-backend:8080"
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
