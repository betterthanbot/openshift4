# Source: litemaas/templates/postgres-statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: litemaas-postgresql
  labels:
    helm.sh/chart: litemaas-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: litemaas
    app.kubernetes.io/version: "0.3.1"
    app.kubernetes.io/name: litemaas
    app.kubernetes.io/instance: litemaas
    app.kubernetes.io/component: database
spec:
  serviceName: litemaas-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litemaas
      app.kubernetes.io/instance: litemaas
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        helm.sh/chart: litemaas-0.1.0
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: litemaas
        app.kubernetes.io/version: "0.3.1"
        app.kubernetes.io/name: litemaas
        app.kubernetes.io/instance: litemaas
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: litemaas
      volumes:
        - name: postgres-init-script
          configMap:
            name: litemaas-postgresql-init
            defaultMode: 0755
      containers:
        - name: postgres
          image: "postgres:16-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "litemaas_db"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: litemaas-postgresql
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litemaas-postgresql
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: postgres-init-script
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
