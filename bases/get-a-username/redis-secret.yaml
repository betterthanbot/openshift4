---
# Redis password for the get-a-username backend.
#
# Placeholder only (base64 of "redis"). ArgoCD creates it once and then leaves
# /data alone — see the `redis` entry under ignoreDifferences in
# argocd/appset-workloads.yaml.
#
# base64, not stringData: the ignoreDifferences jsonPointer is literally
# `/data` and would not match a `stringData:` block.
#
# If you change this on-cluster you MUST change LAB_REDIS_PASS in
# get-a-username-secret (same namespace) to the same value:
#   oc patch secret redis -n guides --type=merge -p '{"stringData":{"database-password":"<new>"}}'
#   oc patch secret get-a-username-secret -n guides --type=merge -p '{"stringData":{"LAB_REDIS_PASS":"<new>"}}'
#   oc rollout restart deploy/redis deploy/get-a-username -n guides
apiVersion: v1
kind: Secret
metadata:
  name: redis
  labels:
    app: redis
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
data:
  database-password: cmVkaXM=
