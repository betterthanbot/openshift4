---
# Not part of the pascaliske/ctfd chart, hand-maintained. Re-running `make template`
# in this directory will not touch this file.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ctfd
  labels:
    app.kubernetes.io/name: ctfd
    app.kubernetes.io/instance: ctfd
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ctfd
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
