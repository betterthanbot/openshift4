# Source: ctfd/templates/controller.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctfd
  labels:
    helm.sh/chart: ctfd-2.0.0
    app.kubernetes.io/name: ctfd
    app.kubernetes.io/instance: ctfd
    app.kubernetes.io/version: "3.8.2"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: ctfd
      app.kubernetes.io/instance: ctfd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ctfd
        app.kubernetes.io/instance: ctfd
    spec:
      serviceAccountName: ctfd
      containers:
        - name: ctfd
          image: "ghcr.io/ctfd/ctfd:3.8.2"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: "TCP"
          env:
            - name: "TZ"
              value: "UTC"
            - name: "DATABASE_URL"
              value: "sqlite:////opt/CTFd/.data/ctfd.db"
            - name: UPLOAD_FOLDER
              value: /data/uploads
            - name: LOG_FOLDER
              value: /data/logs
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ctfd-secrets
                  key: SECRET_KEY
          volumeMounts:
            - name: ctfd-storage
              mountPath: /data/uploads
              subPath: uploads
            - name: ctfd-storage
              mountPath: /data/logs
              subPath: logs
            - mountPath: /opt/CTFd/.data
              name: ctfd-storage
              subPath: dotdata
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
          resources: {}
          securityContext:
      volumes:
        - name: ctfd-storage
          persistentVolumeClaim:
            claimName: ctfd-storage
      securityContext:
        runAsNonRoot: true
