---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Workload hygiene. Everything here is Audit (report + warning) except
# restrict-pdb-zero-disruption, which protects node drains and is enforced.
resources:
- ./disallow-latest-tag.yaml
- ./require-requests-limits.yaml
- ./require-probes.yaml
- ./restrict-image-registries.yaml
- ./require-ro-rootfs.yaml
- ./restrict-pdb-zero-disruption.yaml
- ./disallow-default-namespace.yaml
