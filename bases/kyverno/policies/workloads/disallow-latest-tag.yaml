# An image without a tag, or with :latest, can change underneath a running
# workload: the next pod restart may pull different code than the one before.
# Audit only — reported and warned about, not blocked.
#
# Note: images built on the cluster with S2I are pushed to the internal
# registry as <name>:latest by default and will be reported here.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Workload Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Reports containers in tenant namespaces whose image has no tag or uses
      the mutable tag latest.
spec:
  background: true
  emitWarning: true
  rules:
  - name: require-image-tag
    match:
      any:
      - resources:
          kinds:
          - Pod
          namespaceSelector:
            matchExpressions:
            - key: platform/tenant
              operator: Exists
    validate:
      failureAction: Audit
      message: An image tag (or digest) is required.
      pattern:
        spec:
          =(ephemeralContainers):
          - image: "*:*"
          =(initContainers):
          - image: "*:*"
          containers:
          - image: "*:*"

  - name: disallow-latest
    match:
      any:
      - resources:
          kinds:
          - Pod
          namespaceSelector:
            matchExpressions:
            - key: platform/tenant
              operator: Exists
    validate:
      failureAction: Audit
      message: Using the mutable image tag "latest" is not recommended. Pin a version or a digest.
      pattern:
        spec:
          =(ephemeralContainers):
          - image: "!*:latest"
          =(initContainers):
          - image: "!*:latest"
          containers:
          - image: "!*:latest"
