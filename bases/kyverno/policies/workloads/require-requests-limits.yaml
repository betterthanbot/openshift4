# Every tenant namespace gets default requests and a default memory limit from
# the generated LimitRange (tenancy/default-limitrange.yaml), so pods always
# end up with values. Those defaults are deliberately small and rarely right
# for a real workload. This reports workloads that rely on them instead of
# declaring their own sizing. Audit only.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/title: Require Resource Requests and Memory Limit
    policies.kyverno.io/category: Workload Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment, StatefulSet, DaemonSet
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/description: >-
      Reports Deployments, StatefulSets and DaemonSets in tenant namespaces
      whose containers do not declare CPU and memory requests and a memory
      limit of their own.
spec:
  background: true
  emitWarning: true
  rules:
  # Checked on the workload, not on the Pod: by the time a Pod exists the
  # LimitRange has already filled the gaps and every pod would pass.
  - name: workloads-declare-resources
    match:
      any:
      - resources:
          kinds:
          - Deployment
          - StatefulSet
          - DaemonSet
          namespaceSelector:
            matchExpressions:
            - key: platform/tenant
              operator: Exists
    validate:
      failureAction: Audit
      message: >-
        Set resources.requests.cpu, resources.requests.memory and
        resources.limits.memory on every container. Without them the namespace
        defaults apply (100m CPU, 128Mi requested, 512Mi memory limit).
      pattern:
        spec:
          template:
            spec:
              containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
