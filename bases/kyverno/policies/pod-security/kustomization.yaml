---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# What a tenant pod may do to the node and to its neighbours. All of these only
# apply in namespaces that carry the platform/tenant label.
resources:
- ./pod-security-baseline.yaml
- ./pod-security-restricted.yaml
- ./restrict-node-name.yaml
- ./restrict-control-plane-scheduling.yaml
- ./restrict-priority-classes.yaml
- ./restrict-ovn-gateway-annotations.yaml
