# Reports Roles in tenant namespaces that grant more than they probably meant
# to. Kubernetes already stops a user from granting permissions they do not
# hold, so none of this is an escalation by itself — these are the grants worth
# a second look in a review. Audit only.
#
#   wildcard verbs      "*" also means verbs added to the API in the future
#   wildcard resources  "*" also covers secrets and anything installed later
#   bind / escalate /   the three verbs that let a subject hand out or assume
#   impersonate         permissions beyond its own
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: audit-risky-roles
  annotations:
    policies.kyverno.io/title: Report Overly Broad Roles
    policies.kyverno.io/category: RBAC
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Role
    policies.kyverno.io/description: >-
      Reports Roles in tenant namespaces that use wildcard verbs or resources,
      or that grant the bind, escalate or impersonate verbs.
spec:
  background: true
  emitWarning: true
  rules:
  - name: wildcard-verbs
    match:
      any:
      - resources:
          kinds:
          - rbac.authorization.k8s.io/v1/Role
          namespaceSelector:
            matchExpressions:
            - key: platform/tenant
              operator: Exists
    validate:
      failureAction: Audit
      message: Avoid the wildcard "*" in Role verbs. List the verbs that are needed.
      deny:
        conditions:
          any:
          - key: "{{ contains(request.object.rules[].verbs[] || `[]`, '*') }}"
            operator: Equals
            value: true

  - name: wildcard-resources
    match:
      any:
      - resources:
          kinds:
          - rbac.authorization.k8s.io/v1/Role
          namespaceSelector:
            matchExpressions:
            - key: platform/tenant
              operator: Exists
    validate:
      failureAction: Audit
      message: Avoid the wildcard "*" in Role resources. List the resources that are needed.
      deny:
        conditions:
          any:
          - key: "{{ contains(request.object.rules[].resources[] || `[]`, '*') }}"
            operator: Equals
            value: true

  - name: escalation-verbs
    match:
      any:
      - resources:
          kinds:
          - rbac.authorization.k8s.io/v1/Role
          namespaceSelector:
            matchExpressions:
            - key: platform/tenant
              operator: Exists
    validate:
      failureAction: Audit
      message: >-
        The verbs bind, escalate and impersonate let a subject grant or assume
        permissions beyond its own. Confirm this Role really needs them.
      deny:
        conditions:
          any:
          - key: "{{ request.object.rules[].verbs[] || `[]` }}"
            operator: AnyIn
            value:
            - bind
            - escalate
            - impersonate
