# Reports Routes that serve plain HTTP: no TLS termination at all, or TLS with
# insecureEdgeTerminationPolicy: Allow (which answers on port 80 as well).
# Use Redirect or None instead. Audit only.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-route-tls
  annotations:
    policies.kyverno.io/title: Require TLS on Routes
    policies.kyverno.io/category: Exposure
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Route
    policies.kyverno.io/description: >-
      Reports Routes in tenant namespaces that have no TLS termination or that
      still allow unencrypted HTTP alongside it.
spec:
  background: true
  emitWarning: true
  rules:
  - name: route-uses-tls
    match:
      any:
      - resources:
          kinds:
          - route.openshift.io/v1/Route
          namespaceSelector:
            matchExpressions:
            - key: platform/tenant
              operator: Exists
    validate:
      failureAction: Audit
      message: >-
        Routes should terminate TLS (edge, reencrypt or passthrough) and set
        insecureEdgeTerminationPolicy to Redirect or None.
      deny:
        conditions:
          any:
          - key: "{{ request.object.spec.tls.termination || '' }}"
            operator: Equals
            value: ""
          - key: "{{ request.object.spec.tls.insecureEdgeTerminationPolicy || '' }}"
            operator: Equals
            value: Allow
