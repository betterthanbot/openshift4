apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ./kyverno.yaml
- ./policy-reporter.yaml
- ./namespace.yaml
- ./policies/

namespace: kyverno

secretGenerator:
- name: registry-creds
  namespace: kyverno
  behavior: create

