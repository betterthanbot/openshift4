# ServiceAccount used by the vector log collector pods.
# ClusterLogForwarder will not become Ready without this SA existing first.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logging-collector
  namespace: openshift-logging
---
# Long-lived SA token secret required by vector's directory secret provider.
# Vector reads the bearer token from /var/run/ocp-collector/secrets/logging-collector-token/token.
# Without this secret, vector sends no token and LokiStack returns 403.
apiVersion: v1
kind: Secret
metadata:
  name: logging-collector-token
  namespace: openshift-logging
  annotations:
    kubernetes.io/service-account.name: logging-collector
type: kubernetes.io/service-account-token
---
# Grants the collector SA permission to collect application logs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logging-collector-application-logs
subjects:
  - kind: ServiceAccount
    name: logging-collector
    namespace: openshift-logging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: collect-application-logs
---
# Grants the collector SA permission to collect infrastructure logs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logging-collector-infrastructure-logs
subjects:
  - kind: ServiceAccount
    name: logging-collector
    namespace: openshift-logging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: collect-infrastructure-logs
---
# Grants the collector SA permission to collect audit logs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logging-collector-audit-logs
subjects:
  - kind: ServiceAccount
    name: logging-collector
    namespace: openshift-logging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: collect-audit-logs
---
# Grants the collector SA permission to WRITE logs into LokiStack tenants.
# This ClusterRole is created by the Loki Operator when tenants.mode: openshift-logging.
# Without this binding the vector collector gets 403 Forbidden from the LokiStack gateway.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logging-collector-logs-writer
subjects:
  - kind: ServiceAccount
    name: logging-collector
    namespace: openshift-logging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: logging-collector-logs-writer
