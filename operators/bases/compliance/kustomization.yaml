# ==============================================================================
# operators/bases/compliance — Compliance Operator
#
# Installs the Compliance Operator and the custom ScanSettings / ScanSettingBindings
# (CIS and STIG profiles).
#
# ArgoCD app:  operators-compliance   (argocd/appset-operators.yaml)
# Installs:    compliance-operator (channel stable, redhat-operators) into openshift-compliance
# ==============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Operator install — sync waves -3 (Namespace), -2 (OperatorGroup), -1 (Subscription).
  # ArgoCD waits for the Subscription to report AtLatestKnown before it moves on, so
  # everything below (wave 0 and up) is applied once the operator's CRDs exist.
  - namespace.yaml
  - operatorgroup.yaml
  - subscription.yaml
  # Operands
  - scansettings.yaml
  - scansettingbindings.yaml
