# ==============================================================================
# operators/bases/service-mesh — Service Mesh 3 (Sail)
#
# Installs Red Hat OpenShift Service Mesh 3. Hard dependency of RHOAI 3.x KServe and
# of the MaaS gateway. No operands are defined here: RHOAI creates the Istio CR and
# GatewayClass itself.
#
# ArgoCD app:  operators-service-mesh   (argocd/appset-operators.yaml)
# Installs:    servicemeshoperator3 (channel stable, redhat-operators) into openshift-operators
# ==============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Operator install — sync waves -3 (Namespace), -2 (OperatorGroup), -1 (Subscription).
  # ArgoCD waits for the Subscription to report AtLatestKnown before it moves on, so
  # everything below (wave 0 and up) is applied once the operator's CRDs exist.
  - subscription.yaml
