# ==============================================================================
# operators/bases/connectivity-link — Connectivity Link (Kuadrant)
#
# Installs the RHCL operator and the Kuadrant CR that turns its CRDs into a running
# control plane (Authorino + Limitador). The AuthPolicy / RateLimitPolicy /
# TokenRateLimitPolicy / TelemetryPolicy CRDs that MaaS builds on come from here.
#
# ArgoCD app:  operators-connectivity-link   (argocd/appset-operators.yaml)
# Installs:    rhcl-operator (channel stable, redhat-operators) into openshift-operators
# ==============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Operator install — sync waves -3 (Namespace), -2 (OperatorGroup), -1 (Subscription).
  # ArgoCD waits for the Subscription to report AtLatestKnown before it moves on, so
  # everything below (wave 0 and up) is applied once the operator's CRDs exist.
  - namespace-kuadrant-system.yaml
  - subscription.yaml
  # Operands
  - kuadrant.yaml
