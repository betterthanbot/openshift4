# Identity used by Grafana to query Thanos and LokiStack. The bearer token for this SA
# is stored in grafana-thanos-auth Secret and injected into all GrafanaDatasource CRs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-sa
  namespace: grafana
---
# Grants the SA read access to all metrics in OpenShift monitoring (Thanos querier).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: grafana-sa
    namespace: grafana
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
---
# ServiceAccount used by the sync-hook Job to create a token for grafana-sa and write grafana-thanos-auth.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-token-builder-sa
  namespace: grafana
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-token-builder
  namespace: grafana
rules:
  # Create a TokenRequest token for grafana-sa
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  # Write the bearer token to grafana-thanos-auth
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
  # Annotate GrafanaDatasource CRs after Secret update to trigger Grafana Operator reconciliation
  - apiGroups: ["grafana.integreatly.org"]
    resources: ["grafanadatasources"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-token-builder
  namespace: grafana
subjects:
  - kind: ServiceAccount
    name: grafana-token-builder-sa
    namespace: grafana
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-token-builder
---
# Grants grafana-sa read access to all LokiStack log tenants (application, infrastructure,
# audit). cluster-admin is required because the LokiStack OPA gateway enforces audit log
# access via elevated privilege checks; scoped pod/log RBAC only covers app + infra.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-sa-cluster-admin
subjects:
  - kind: ServiceAccount
    name: grafana-sa
    namespace: grafana
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
