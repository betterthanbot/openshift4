# Placeholder credential Secret — same pattern as the LokiStack S3 secrets.
# ArgoCD creates it empty-ish on first sync; fill it in with the real password
# and the Grafana operator picks it up on the next reconcile:
#
#   oc create secret generic maas-postgres-grafana-auth -n grafana \
#     --from-literal=password="$(oc get secret maas-postgres \
#       -n redhat-ods-applications -o jsonpath='{.data.database-password}' | base64 -d)" \
#     --dry-run=client -o yaml | oc apply -f -
#
# CreateOnly + IgnoreExtraneous stop ArgoCD resetting it back to the placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: maas-postgres-grafana-auth
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
type: Opaque
stringData:
  password: "CHANGE_ME"
