# Community Grafana Operator — Grafana instance.
# The `dashboards` label below must match the instanceSelector used in the
# GrafanaDashboard and GrafanaDatasource CRs (bases/grafana uses "grafana-a").

apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana-a
  namespace: grafana
  labels:
    dashboards: grafana-a
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  config:
    log:
      mode: console
    security:
      admin_password: secret
      admin_user: root
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
  route:
    spec:
      port:
        targetPort: grafana
      tls:
        termination: edge
