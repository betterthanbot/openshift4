# Workshop HTPasswd identity provider — lets workshop attendees (user1..userN,
# created by bases/get-a-username/label-ns.sh) actually log in to the OpenShift
# console. Without an identity provider, `oc create user` only creates orphaned User
# objects with no way to authenticate.
#
# The Secret referenced below (workshop-htpasswd, in openshift-config) holds NO real
# hashes in git: a placeholder is created on first sync and the real file must be set on
# the cluster. Create/rotate it with:
#   oc apply -f <local-only-file, never committed>
# See overlay/my-sno-cluster/get-a-username/README.md for the template and the
# regeneration one-liner.

# Placeholder Secret for the workshop HTPasswd identity provider.
#
# ArgoCD will CREATE this secret on first sync (with a placeholder htpasswd
# entry that authenticates no one) but will NEVER overwrite it after that —
# ignoreDifferences on the Secret's data field in appset-operators.yaml
# prevents ArgoCD from touching the data once real hashes are set.
#
# Set the real values via the OpenShift CLI (never commit real hashes to git):
#   oc edit secret workshop-htpasswd -n openshift-config
# or replace it wholesale with a freshly generated file:
#   PASS='<workshop-password>'
#   > htpasswd.txt
#   for i in $(seq 1 100); do htpasswd -Bbn "user${i}" "$PASS" >> htpasswd.txt; done
#   oc create secret generic workshop-htpasswd \
#     -n openshift-config --from-file=htpasswd=htpasswd.txt \
#     --dry-run=client -o yaml | oc apply -f -
# See overlay/my-sno-cluster/get-a-username/README.md for the full workflow.
apiVersion: v1
kind: Secret
metadata:
  name: workshop-htpasswd
  namespace: openshift-config
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
stringData:
  # Empty on purpose — an htpasswd file with no entries authenticates no one.
  # Replace via `oc edit` / `oc apply` as described above.
  htpasswd: ""
