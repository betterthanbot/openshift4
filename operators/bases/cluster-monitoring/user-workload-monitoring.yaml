# User workload monitoring.
#
# `enableUserWorkload: true` in the cluster-monitoring-config ConfigMap is what makes
# the cluster-monitoring-operator stand up the whole openshift-user-workload-monitoring
# stack (prometheus-user-workload x2, thanos-ruler-user-workload x2, its own
# prometheus-operator). Without it, ServiceMonitors and PrometheusRules in namespaces
# that do NOT carry `openshift.io/cluster-monitoring: "true"` are simply never scraped.
#
# NOTE on this cluster specifically: every namespace that currently holds a
# ServiceMonitor (kuadrant-system, nvidia-gpu-operator, vllm-project,
# redhat-ods-applications, netobserv, ...) carries the cluster-monitoring label, so the
# PLATFORM Prometheus scrapes them and UWM had no targets of its own. It is still
# enabled here because:
#   - it is a prerequisite for any workload namespace you add WITHOUT that label, which
#     is the normal case, and
#   - turning it off would be a behaviour change relative to the captured cluster.
# Remove this file from kustomization.yaml if you would rather not pay for the four extra
# Prometheus/Thanos pods.
#
# The ConfigMap is a merge target, not solely ours — OCP reads other keys from it too
# (retention, storage, alertmanager). ServerSideApply keeps this to the one key rather
# than replacing the whole object.

# Turns on the openshift-user-workload-monitoring stack.
#
# ServerSideApply matters here: cluster-monitoring-config is a shared merge
# target that OCP also reads retention / storage / alertmanager settings from.
# A normal apply would replace the whole `config.yaml` key with just ours.
#
# Wave 0 — this needs to be true before any workload ServiceMonitor is created,
# and the cluster-monitoring-operator takes a couple of minutes to roll the
# stack out.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  config.yaml: |
    enableUserWorkload: true
