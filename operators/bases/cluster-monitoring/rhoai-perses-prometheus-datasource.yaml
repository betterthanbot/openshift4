# DISABLED — not listed in kustomization.yaml.
#
# RHOAI 3.5.0's rhods-operator now generates its own default PrometheusDatasource
# (cluster-prometheus-datasource, owned by the Monitoring CR default-monitoring)
# pointing at the same global Thanos Querier. Perses only allows one `default: true`
# datasource per plugin kind, and this hand-written one (created 2026-09-07, before that
# operator behavior existed) was winning the race and leaving
# cluster-prometheus-datasource permanently Degraded with "cannot be a default
# PrometheusDatasource because there is already one defined named
# prometheus-datasource" — which is exactly the "No datasource found for kind
# 'PrometheusDatasource'" error on every RHOAI dashboard panel. Disabled now that the
# operator handles this itself. Re-enable (add it back to kustomization.yaml) only if a
# future operator regresses this again.
#
# Port 9091 = cluster-wide tenancy (needs cluster-monitoring-view, granted by
# rhoai-perses-cluster-monitoring-view.yaml). Port 9092 is the per-namespace port and
# would scope the dashboards to a single namespace.
#
# RETESTED 2026-08-14 on cluster-dgs2z: client.kubernetesAuth.enable STILL does not
# attach a bearer token. With it on, TLS succeeds and Thanos's kube-rbac-proxy answers a
# plain-text 401. techdebt #4's finding stands, so this uses the manual-secret path
# below instead. Retest by switching to kubernetesAuth after any COO/perses-operator
# upgrade; if the panels populate, delete the manual secret and the bootstrap step.
#
# The manual secret (prometheus-datasource-manual-secret) is a PERSES-NATIVE secret —
# NOT a Kubernetes Secret, so `oc get secret` will never show it and git cannot manage
# it. It lives in Perses' own store and is created through the Perses HTTP API.
# Bootstrap on a new cluster (token is capped at 1 year and needs manual renewal):
#
#   CA=$(oc get cm thanos-querier-serving-ca -n redhat-ods-monitoring \
#          -o jsonpath='{.data.service-ca\.crt}')
#   TOK=$(oc create token default -n redhat-ods-monitoring --duration=8760h)
#   # POST {"kind":"Secret","metadata":{"project":"redhat-ods-monitoring",
#   #   "name":"prometheus-datasource-manual-secret"},"spec":{
#   #   "tlsConfig":{"ca":"$CA"},
#   #   "authorization":{"type":"Bearer","credentials":"$TOK"}}}
#   # to http://localhost:8080/api/v1/projects/redhat-ods-monitoring/secrets
#   # from inside pod data-science-perses-0.
#
# Created on cluster-dgs2z 2026-08-14; token expires 2027-08-14.

# techdebt.md #2 + #4 — the default Prometheus datasource that the RHOAI console's
# own "Observe & monitor -> Dashboard" (Perses, not Grafana) depends on.
#
# WHY THIS IS HAND-WRITTEN. The rhods-operator is supposed to generate this and
# does not. Both operator-generated dashboards — dashboard-0-cluster-admin and
# dashboard-1-model — reference their datasource by KIND ONLY:
#
#   datasource:
#     kind: PrometheusDatasource      # note: no `name`
#
# With no named target they resolve against whichever PersesDatasource in their
# namespace carries `default: true`. When none exists, every panel renders
#   "No datasource found for kind 'PrometheusDatasource' and name 'undefined'"
# which is the literal string 'undefined' from the dashboard JS, not a config
# typo. One object with default: true fixes every panel on both tabs at once.
#
# WHY THE GLOBAL THANOS AND NOT THE DATA-SCIENCE ONE. Pointing this at
# thanos-querier-data-science-thanos-querier:10902 clears the error but leaves
# every panel on "No data": that Prometheus is monitoring.rhobs/v1 and its
# service discovery is hardcoded to its own namespace, so it never sees
# kube-state-metrics, node-exporter, DCGM or the vLLM pods. Re-verified on
# cluster-dgs2z 2026-08-14 — /api/v1/stores returned {} and `up` returned zero
# series. The metrics these dashboards want only exist on the global Thanos.
#
# Reaching the global Thanos needs both of the objects above:
#   thanosServingCA          -> trusts its serving cert
#   persesClusterMonitoringView -> grants the Perses SA (`default`) read access
#
# KNOWN RISK — kubernetesAuth. techdebt #4 recorded that
# client.kubernetesAuth.enable did NOT attach a bearer token on the COO version
# current in 2026-07, giving 401s from Thanos's kube-rbac-proxy, and that the
# workaround was a Perses-NATIVE secret created through the Perses HTTP API —
# an object Kubernetes cannot see and git cannot track. Those notes explicitly
# say to retest after an operator upgrade, which is what this block does. If
# panels return 401/"No data" rather than the datasource error, kubernetesAuth
# is still broken: fall back to the Perses-native secret described in
# techdebt.md #4 and set persesPrometheusDatasource.enabled: false here.
apiVersion: perses.dev/v1alpha2
kind: PersesDatasource
metadata:
  name: prometheus-datasource
  namespace: redhat-ods-monitoring
  annotations:
    # Wave 6 — after the CA ConfigMap (wave 5) it trusts and the ClusterRoleBinding.
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  config:
    # The whole point — see the header. Exactly one datasource in this namespace
    # may carry this.
    default: true
    display:
      name: "Prometheus (Cluster - global Thanos)"
    plugin:
      kind: PrometheusDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            # REQUIRED, and easy to miss. `client.tls` above only makes the
            # perses-operator MATERIALISE a Perses-native secret named
            # <datasource>-secret holding the CA; it does not wire it into the
            # proxy. Without this reference the proxy dials Thanos with an empty
            # trust store and every panel fails with
            #   tls: failed to verify certificate: x509: certificate signed by
            #   unknown authority
            # even though the CA is correct and present. Confirmed on
            # cluster-dgs2z 2026-08-14. The name is derived by the operator, not
            # chosen by us.
            secret: prometheus-datasource-manual-secret
            url: "https://thanos-querier.openshift-monitoring.svc:9091"
        scrapeInterval: 30s
