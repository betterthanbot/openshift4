# RHACS SecuredCluster — registers this cluster's Sensor/Collector with Central.
#
# HARD PREREQUISITE — SecuredCluster cannot register until a cluster
# registration secret (CRS) exists in the `stackrox` namespace. The CRS is
# issued by Central, so it cannot exist on a cold bootstrap, and ArgoCD
# applying SecuredCluster in the same sync as Central leaves it stuck.
#
# Two ways to unblock it:
#   1. Remove this file from kustomization.yaml on first bootstrap. Once Central
#      is Available, generate the CRS and apply it, then add the file back:
#        oc -n stackrox get secret central-htpasswd \
#          -o go-template='{{index .data "password" | base64decode}}'
#        # log in to the Central route -> Platform Configuration -> Clusters
#        # -> Cluster registration secrets -> Create -> download the YAML
#        oc apply -f <cluster-registration-secret>.yaml -n stackrox
#   2. Leave it in and let ArgoCD retry — it will keep failing until the
#      CRS lands, then converge on its own.
#
# On first registration Sensor mints tls-cert-sensor / tls-cert-collector /
# tls-cert-admission-control from the CRS; collector and admission-control
# mount those and stay in ContainerCreating until they exist. Sensor prefers
# the older `*-tls` init-bundle secrets over the CRS when both are present, so
# after rotating to a CRS delete sensor-tls / collector-tls /
# admission-control-tls — otherwise Sensor keeps presenting the stale (likely
# revoked) init-bundle certs and never registers.
#
# Neither the CRS nor the `*-tls` trio is in git — they hold cluster-specific
# service certs.
#
# centralEndpoint is deliberately unset: it defaults to central.stackrox.svc:443,
# which is correct for a Central running in the same cluster (the case here).

apiVersion: platform.stackrox.io/v1alpha1
kind: SecuredCluster
metadata:
  name: stackrox-secured-cluster-services
  namespace: stackrox
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # CHANGE ME: logical name for this cluster shown in the RHACS console
  clusterName: "my-cluster"
  # Sensor's default request is 2 CPU, which does not fit on a worker pool
  # already ~90% requested (RHACS Central + scanners alone account for most of
  # it). The pod stays Pending, and because Sensor is what issues the
  # tls-cert-* secrets, collector and admission-control hang behind it.
  sensor:
    resources:
      limits:
        cpu: "2"
        memory: 8Gi
      requests:
        cpu: "1"
        memory: 4Gi
