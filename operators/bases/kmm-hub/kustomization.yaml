# ==============================================================================
# operators/bases/kmm-hub — Kernel Module Management Hub
#
# Installs the KMM Hub operator. Disabled; no operand is defined.
#
# ArgoCD app:  operators-kmm-hub   (argocd/appset-operators.yaml)
# Installs:    kernel-module-management-hub (channel stable, redhat-operators) into openshift-kmm-hub
# Status:      DISABLED — excluded in argocd/appset-operators.yaml
# ==============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Operator install — sync waves -3 (Namespace), -2 (OperatorGroup), -1 (Subscription).
  # ArgoCD waits for the Subscription to report AtLatestKnown before it moves on, so
  # everything below (wave 0 and up) is applied once the operator's CRDs exist.
  - namespace.yaml
  - operatorgroup.yaml
  - subscription.yaml
