# Red Hat build of OpenTelemetry — OLM Subscription (sync wave -1).
#
# Backs the RHOAI monitoring stack: DSCInitialization.spec.monitoring.metrics /
# .traces makes the RHOAI operator create an OpenTelemetryCollector
# ("data-science-collector") in redhat-ods-monitoring. Without this operator the
# DSCI monitoring block never reconciles and no MaaS metrics are scraped.

apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: opentelemetry-product
  namespace: openshift-opentelemetry-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  channel: "stable"
  name: "opentelemetry-product"
  source: "redhat-operators"
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  startingCSV: "opentelemetry-operator.v0.158.0-202610221301"
