# ==============================================================================
# operators/bases/opentelemetry — Red Hat build of OpenTelemetry
#
# Installs the OpenTelemetry operator that backs the RHOAI monitoring stack. No
# operands are defined here: the RHOAI operator creates the collector itself.
#
# ArgoCD app:  operators-opentelemetry   (argocd/appset-operators.yaml)
# Installs:    opentelemetry-product (channel stable, redhat-operators) into openshift-opentelemetry-operator
# ==============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Operator install — sync waves -3 (Namespace), -2 (OperatorGroup), -1 (Subscription).
  # ArgoCD waits for the Subscription to report AtLatestKnown before it moves on, so
  # everything below (wave 0 and up) is applied once the operator's CRDs exist.
  - namespace.yaml
  - operatorgroup.yaml
  - subscription.yaml
