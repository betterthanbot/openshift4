# ==============================================================================
# operators/bases/rhoai — Red Hat OpenShift AI (RHODS)
#
# Installs the RHODS operator, then DSCInitialization, the DataScienceCluster and the
# OdhDashboardConfig feature flags. Turning on kserve.modelsAsService here is what
# registers the maas.opendatahub.io CRDs used by the `maas` app.
#
# The overlay also creates the vllm-project namespace the demo models are served from.
#
# ArgoCD app:  operators-rhoai   (argocd/appset-operators.yaml)
# Installs:    rhods-operator (channel stable-3.x, redhat-operators) into redhat-ods-operator
# Needs:       service-mesh, connectivity-link  (KServe gateway + MaaS)
#              opentelemetry, tempo             (DSCI monitoring block)
# ==============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Operator install — sync waves -3 (Namespace), -2 (OperatorGroup), -1 (Subscription).
  # ArgoCD waits for the Subscription to report AtLatestKnown before it moves on, so
  # everything below (wave 0 and up) is applied once the operator's CRDs exist.
  - namespace.yaml
  - operatorgroup.yaml
  - subscription.yaml
  # Operands
  - dscinitialization.yaml
  - datasciencecluster.yaml
  - odhdashboardconfig.yaml
