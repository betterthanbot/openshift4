# ==============================================================================
# operators/bases/tempo — Red Hat build of Tempo
#
# Installs the Tempo operator that backs RHOAI tracing. No operands are defined
# here: the RHOAI operator creates the TempoMonolithic itself.
#
# ArgoCD app:  operators-tempo   (argocd/appset-operators.yaml)
# Installs:    tempo-product (channel stable, redhat-operators) into openshift-tempo-operator
# ==============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Operator install — sync waves -3 (Namespace), -2 (OperatorGroup), -1 (Subscription).
  # ArgoCD waits for the Subscription to report AtLatestKnown before it moves on, so
  # everything below (wave 0 and up) is applied once the operator's CRDs exist.
  - namespace.yaml
  - operatorgroup.yaml
  - subscription.yaml
