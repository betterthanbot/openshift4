# Red Hat build of Tempo — OLM Subscription (sync wave -1).
#
# Distributed tracing backend for RHOAI. DSCInitialization.spec.monitoring.traces
# (storage.backend: pv) makes the RHOAI operator create a TempoMonolithic
# ("data-science-tempomonolithic") in redhat-ods-monitoring.

apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: tempo-product
  namespace: openshift-tempo-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  channel: "stable"
  name: "tempo-product"
  source: "redhat-operators"
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  startingCSV: "tempo-operator.v0.22.0-4"
