# MaaS database.
#
# One small PostgreSQL serving two jobs:
#   1. the API-key store behind maas-api — without it MaaS does not start and no API keys
#      can be minted or validated (see db-secrets.yaml for how maas-api finds it);
#   2. the long-term usage store behind the "MaaS Postgres" Grafana datasource (see the
#      grafana-operator app) and the MaaS stakeholder / chargeback dashboards in
#      bases/grafana. Kuadrant + the RHOAI Thanos only keep short-window counters; this is
#      where rolled-up usage lands. Nothing in this repo writes usage rows here — only
#      maas-api's own tables are populated automatically.
#
# Credentials: the maas-postgres Secret this Deployment reads (and maas-db-config for
# maas-api) are fixed sandbox values in db-secrets.yaml, applied at wave 1 before this
# Deployment (wave 2) starts.
#
# IMAGE: registry.redhat.io/rhel9/postgresql-16 — the same image RHOAI itself ships
# (RELATED_IMAGE_POSTGRESQL_16_IMAGE in the rhods-operator 3.5.2 CSV), pulled with the
# cluster's global pull secret. It replaces the `openshift/postgresql:15-el9` imagestream
# tag, which the samples operator does not provide on OCP 4.22 (only 10-el8, 12-el8,
# 13-el8, 13-el9, latest) — the Deployment would sit in ImagePullBackOff and maas-api
# would have no database. Same sclorg image family: same POSTGRESQL_* env vars, same
# /var/lib/pgsql/data and /usr/libexec/check-container, so nothing else changed.
# Pinning: swap `:latest` for a digest if you need reproducible pulls. A PVC already
# holding PostgreSQL 15 data cannot be opened by 16 as-is: set POSTGRESQL_UPGRADE=copy
# for one start, or recreate the PVC (a fresh cluster has neither problem).
#
# CHANGE ME: storageClassName must name an Immediate-binding class (see the
# storageclass app).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maas-postgres
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: gp3-csi-immediate
---
apiVersion: v1
kind: Service
metadata:
  name: maas-postgres
  namespace: redhat-ods-applications
  labels:
    app: maas-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  selector:
    app: maas-postgres
  ports:
    - name: postgresql
      port: 5432
      protocol: TCP
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-postgres
  namespace: redhat-ods-applications
  labels:
    app: maas-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maas-postgres
  strategy:
    # Recreate, not RollingUpdate: the PVC is ReadWriteOnce, so two pods can
    # never be up at once anyway.
    type: Recreate
  template:
    metadata:
      labels:
        app: maas-postgres
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-16:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: maas-postgres
                  key: database-name
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: maas-postgres
                  key: database-user
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maas-postgres
                  key: database-password
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["/usr/libexec/check-container"]
            initialDelaySeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["/usr/libexec/check-container", "--live"]
            initialDelaySeconds: 120
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: maas-postgres
