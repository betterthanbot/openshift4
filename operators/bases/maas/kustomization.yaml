# ==============================================================================
# operators/bases/maas — Models-as-a-Service (MaaS) platform
#
# Sits on top of two things that must already be in place:
#   1. connectivity-link  -> rhcl-operator (Kuadrant) + the Kuadrant CR
#      service-mesh       -> servicemeshoperator3
#   2. rhoai: the DSC's aigateway.modelsAsAService = Managed
#      (RHOAI 3.5 moved this from the deprecated kserve.modelsAsService)
#      (creates maas-api + maas-controller and the maas.opendatahub.io CRDs)
# and provides the Gateway the models attach to (gateway.yaml, in this app).
#
# What this app supplies so MaaS can come up (all verified against the 3.5.2 images):
#   * PostgreSQL for the API keys      metrics-db.yaml  (postgresql-16, PVC on gp3-csi-immediate)
#   * its credentials (fixed, sandbox) db-secrets.yaml  (maas-postgres + maas-db-config)
#   * Authorino listener TLS           authorino-tls.yaml
#   * the Gateway + its TLS hostname   gateway.yaml     (hostname patched in the overlay)
#   * the Tenant, gateway telemetry, empty rhods-* groups
# RHOAI 3.5 runs maas-api in its own namespace (redhat-ai-gateway-infra) and the controller
# copies maas-db-config there from redhat-ods-applications — see db-secrets.yaml for the
# post-sync checks.
#
# CLEAN SLATE ON PURPOSE: no models, MaaSSubscriptions, MaaSAuthPolicies, team groups or
# per-tier rate limits are deployed. Once the app is Synced you create those yourself
# (RHOAI dashboard > Models-as-a-Service, or `oc apply` MaaSSubscription / MaaSAuthPolicy
# in models-as-a-service) and mint your own API keys on the dashboard's API Keys page.
#
# Request path:
#   client -> maas-default-gateway (Gateway API, openshift-default class)
#          -> AuthPolicy (Authorino: who are you, which subscription?)
#          -> RateLimitPolicy / TokenRateLimitPolicy (Limitador: how much?)
#          -> TelemetryPolicy (per-user / per-org usage metrics)
#          -> HTTPRoute -> InferencePool -> vLLM pod
#
# NOT captured here on purpose — all of it is generated by the maas-controller from the
# Tenant / MaaSSubscription / MaaSAuthPolicy CRs and will be recreated automatically.
# Committing it would just fight the controller:
#   * AuthPolicy      gateway-default-auth, gateway-auth-policy,
#                     maas-api-auth-policy, maas-auth-<model>
#   * TokenRateLimitPolicy gateway-default-deny, maas-trlp-<model>
#   * HTTPRoute       maas-api-route, <model>-kserve-route
#   * MaaSModelRef    <model>            (owned by each LLMInferenceService)
#   * InferencePool   <model>-inference-pool
#   * the per-tier namespaces maas-default-gateway-tier-*
#
# ArgoCD app:  operators-maas   (argocd/appset-operators.yaml)
# Needs:       rhoai               (maas.opendatahub.io CRDs; redhat-ods-applications namespace)
#              connectivity-link   (Kuadrant CRDs + CR)
#              service-mesh
#              storageclass        (gp3-csi-immediate, for the metrics database PVC)
#              a TLS Secret `cert-manager-ingress-cert` in openshift-ingress (not in this repo)
# ==============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Namespaces (sync wave -3)
  - namespace.yaml
  # Operands
  - metrics-db.yaml
  - db-secrets.yaml
  - authorino-tls.yaml
  - gateway.yaml
  - tenant.yaml
  - groups.yaml
  - telemetry.yaml
