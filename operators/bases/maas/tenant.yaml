# MaaS Tenant — the root object. The maas-controller reacts to this by wiring
# the gateway with its default AuthPolicy / TokenRateLimitPolicy (deny-all
# unless a subscription says otherwise) and by creating the per-tier namespaces.
apiVersion: maas.opendatahub.io/v1alpha1
kind: Tenant
metadata:
  name: default-tenant
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # The maas.opendatahub.io CRDs are registered by the DataScienceCluster
    # (kserve.modelsAsService), which lives in the rhoai app. Until it has
    # reconciled this kind does not exist when ArgoCD validates the sync, and
    # without this annotation ArgoCD rejects the ENTIRE sync of this app up
    # front and applies nothing. See techdebt.md #14.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  gatewayRef:
    name: maas-default-gateway
    namespace: openshift-ingress
  # telemetry.metrics.* control which labels the maas-controller puts on the usage
  # metrics that the "AI MaaS Admin & Analyst" dashboard reads.
  telemetry:
    enabled: true
    metrics:
      captureGroup: false
      captureModelUsage: true
      captureOrganization: true
      captureUser: true
