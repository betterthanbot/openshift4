# Gateway-scoped Kuadrant policies.
#
# These are the ones a human wrote (they carry opendatahub.io/dashboard=true, i.e. they
# were created through the RHOAI dashboard) as opposed to the maas-controller's
# generated defaults. They enforce a *request* ceiling and a *token* ceiling per tier,
# on top of the per-subscription token limits in subscriptions.yaml.
#
# `auth.identity.tier` is set by the MaaS AuthPolicy; the tier name is
# "<subscription>-tier". The /v1/models exclusion keeps model discovery free.
# `model` in the TelemetryPolicy is read out of the response body, which is why it
# needs the body-based routing path to work.

# Per-tier REQUEST ceiling on the gateway (Limitador).
#
# Counted per authenticated user (auth.identity.userid), not per tier, so the
# limit is "each member of this tier gets N requests per window".
# `/v1/models` is excluded so model discovery is never rate limited.
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: maas-default-gateway-request-rate-limits
  namespace: openshift-ingress
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: maas-default-gateway
  limits:
    team-alpha-tier-requests:
      counters:
        - expression: auth.identity.userid
      rates:
        - limit: 5
          window: 1m
      when:
        - predicate: "auth.identity.tier == \"team-alpha-tier\" && !request.path.endsWith(\"/v1/models\")"
    team-bravo-tier-requests:
      counters:
        - expression: auth.identity.userid
      rates:
        - limit: 30
          window: 1m
      when:
        - predicate: "auth.identity.tier == \"team-bravo-tier\" && !request.path.endsWith(\"/v1/models\")"
---
# Per-tier TOKEN ceiling on the gateway. Same shape as the RateLimitPolicy
# above but counts LLM tokens rather than HTTP requests, which is what actually
# maps to cost.
apiVersion: kuadrant.io/v1alpha1
kind: TokenRateLimitPolicy
metadata:
  name: maas-default-gateway-token-rate-limits
  namespace: openshift-ingress
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: maas-default-gateway
  limits:
    team-alpha-tier-tokens:
      counters:
        - expression: auth.identity.userid
      rates:
        - limit: 100
          window: 1m
      when:
        - predicate: "auth.identity.tier == \"team-alpha-tier\" && !request.path.endsWith(\"/v1/models\")"
    team-bravo-tier-tokens:
      counters:
        - expression: auth.identity.userid
      rates:
        - limit: 300
          window: 1m
      when:
        - predicate: "auth.identity.tier == \"team-bravo-tier\" && !request.path.endsWith(\"/v1/models\")"
---
# Adds identity + subscription labels to the gateway's request metrics.
# These label names are what the MaaS Grafana dashboards in bases/grafana group
# by — change one here and the corresponding dashboard panel goes blank.
apiVersion: extensions.kuadrant.io/v1alpha1
kind: TelemetryPolicy
metadata:
  name: maas-telemetry
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: maas-observability
    maas.opendatahub.io/tenant-name: default-tenant
    maas.opendatahub.io/tenant-namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: maas-default-gateway
  metrics:
    default:
      labels:
        cost_center: "auth.identity.subscription_info.costCenter"
        model: "responseBodyJSON(\"/model\")"
        organization_id: "auth.identity.subscription_info.organizationId"
        subscription: "auth.identity.selected_subscription"
        user: "auth.identity.userid"
