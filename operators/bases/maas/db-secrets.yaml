# MaaS database credentials — fixed, committed on purpose.
#
# This is a throwaway sandbox (the cluster is deleted and rebuilt weekly), so the password
# lives in git and nothing has to be created by hand. Do NOT reuse this for anything that
# lasts: to harden, swap these two Secrets for a generated/sealed/external one.
#
# maas-api keeps its API keys in PostgreSQL and will not start without a Secret named
# `maas-db-config` with the key `DB_CONNECTION_URL` (rhods-operator 3.5.2 maas-controller:
# "database Secret … not found … Create the Secret with key 'DB_CONNECTION_URL'").
#
#   maas-postgres   the SERVER's credentials, read by the postgres container (metrics-db.yaml)
#   maas-db-config  the CLIENT's connection string, read by maas-api
# The password must be identical in both, and in maas-postgres-grafana-auth
# (bases/grafana-operator/maas-postgres-auth-secret.yaml). Change it in all three or none,
# and only on a fresh PVC — the postgres image applies the password at first start only.
#
# WHERE maas-api READS IT — RHOAI 3.5 runs maas-api in its own namespace
# (redhat-ai-gateway-infra, derived from redhat-ods-applications); the controller COPIES
# maas-db-config there from redhat-ods-applications. So this lives in redhat-ods-applications.
#
# VERIFY after the first sync:
#   oc get secret maas-db-config -n redhat-ai-gateway-infra      # copied by maas-controller
#   oc get pods -n redhat-ai-gateway-infra                       # maas-api Running
# If the copy is missing (maas-controller log: "insufficient RBAC to migrate maas-db-config"):
#   oc get secret maas-db-config -n redhat-ods-applications -o json \
#     | jq 'del(.metadata.namespace,.metadata.uid,.metadata.resourceVersion,.metadata.creationTimestamp,.metadata.ownerReferences)' \
#     | oc apply -n redhat-ai-gateway-infra -f -
apiVersion: v1
kind: Secret
metadata:
  name: maas-postgres
  namespace: redhat-ods-applications
  annotations:
    # Wave 1 — before the postgres Deployment (wave 2) that reads it.
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
stringData:
  database-name: "maas"
  database-user: "maas"
  database-password: "MaasSandbox2026"
---
apiVersion: v1
kind: Secret
metadata:
  name: maas-db-config
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
stringData:
  # sslmode=disable is deliberate: the postgresql image serves plaintext on 5432 with no
  # server certificate, and the connection never leaves the cluster SDN.
  DB_CONNECTION_URL: "postgresql://maas:MaasSandbox2026@maas-postgres.redhat-ods-applications.svc.cluster.local:5432/maas?sslmode=disable"
