# OpenShift Lightspeed (Red Hat) — OLM Subscription (sync wave -1).
#
# DISABLED BY DEFAULT (excluded in argocd/appset-operators.yaml): present on the
# source cluster but never configured — no OLSConfig CR existed, so the operator sat
# idle. Enable it and add an OLSConfig if you want the in-console assistant.
#
# installPlanApproval is Manual: the first InstallPlan has to be approved by hand
#   oc get installplan -n openshift-lightspeed
#   oc patch installplan <name> -n openshift-lightspeed --type merge -p '{"spec":{"approved":true}}'
# and ArgoCD's built-in Subscription health check holds this app's later sync waves
# (anything that needs the operator's CRDs) until that happens.

apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: lightspeed-operator
  namespace: openshift-lightspeed
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  channel: "stable"
  name: "lightspeed-operator"
  source: "redhat-operators"
  sourceNamespace: openshift-marketplace
  installPlanApproval: Manual
  startingCSV: "lightspeed-operator.v2.0.0"
