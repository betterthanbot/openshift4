# NVIDIA GPU Operator — ClusterPolicy
# Manages driver, toolkit, device-plugin, DCGM, GFD daemonsets on GPU nodes.
#
# This is the operator's own default spec for gpu-operator-certified v26.3.x, with only the
# non-default fields written out (fields the operator/CRD defaults itself — operator.runtimeClass,
# cdi.default, toolkit.installDir, validator.cuda env — are deliberately left unset, so they track
# the operator's defaults). Re-capture it after a major operator bump rather than hand-editing.
#
# Settings that differ from the previous version of this file:
#   * migManager.enabled:  false -> true
#   * mig.strategy:        none  -> single
#   * validator.cuda.env WITH_WORKLOAD=false: removed — the validator now runs its real CUDA
#     vectorAdd check again, instead of a driver/library presence check only.
# The previous version disabled MIG manager for a DRA / dynamic-MIG setup (nvidia-dra-driver-gpu).
# No such driver is deployed from this repo, so that reasoning no longer applies.
#
# Hardware note: the GPU MachineSet is g4dn (NVIDIA T4). The T4 has no MIG support, so mig-manager
# will find nothing to partition (it labels the node mig.capable=false) and `mig.strategy: single`
# has no effect there. Both only matter on MIG-capable GPUs (A100 / H100 / A30 ...).
#
# The NVIDIA operator is sensitive to partially-specified ClusterPolicies —
# prefer capturing the whole default over hand-picking fields.
#
# The tolerations are intentionally absent: the operator injects its own
# nvidia.com/gpu:NoSchedule toleration into every daemonset it owns.
apiVersion: nvidia.com/v1
kind: ClusterPolicy
metadata:
  name: gpu-cluster-policy
  annotations:
    # The ClusterPolicy CRD only exists once the operator CSV is installed.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  operator:
    use_ocp_driver_toolkit: true
  cdi:
    enabled: true
    nriPluginEnabled: false
  sandboxWorkloads:
    enabled: false
    defaultWorkload: container
    mode: kubevirt
  driver:
    enabled: true
    useNvidiaDriverCRD: false
    kernelModuleType: auto
    upgradePolicy:
      autoUpgrade: true
      drain:
        deleteEmptyDir: false
        enable: false
        force: false
        timeoutSeconds: 300
      maxParallelUpgrades: 1
      maxUnavailable: 25%
      podDeletion:
        deleteEmptyDir: false
        force: false
        timeoutSeconds: 300
      waitForCompletion:
        timeoutSeconds: 0
    repoConfig:
      configMapName: ""
    certConfig:
      name: ""
    licensingConfig:
      nlsEnabled: true
      secretName: ""
    virtualTopology:
      config: ""
    kernelModuleConfig:
      name: ""
  dcgmExporter:
    enabled: true
    config:
      name: ""
    serviceMonitor:
      enabled: true
  dcgm:
    enabled: true
  daemonsets:
    updateStrategy: RollingUpdate
    rollingUpdate:
      maxUnavailable: "1"
  devicePlugin:
    enabled: true
    config:
      name: ""
      default: ""
    mps:
      root: /run/nvidia/mps
  gfd:
    enabled: true
  migManager:
    enabled: true
  nodeStatusExporter:
    enabled: true
  mig:
    strategy: single
  toolkit:
    enabled: true
  validator:
    plugin:
      env: []
  vgpuManager:
    enabled: false
  vgpuDeviceManager:
    enabled: true
  sandboxDevicePlugin:
    enabled: true
  kataSandboxDevicePlugin:
    enabled: true
  vfioManager:
    enabled: true
  ccManager:
    enabled: true
  gds:
    enabled: false
  gdrcopy:
    enabled: false
