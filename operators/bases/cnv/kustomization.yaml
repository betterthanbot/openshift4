# ==============================================================================
# operators/bases/cnv — OpenShift Virtualization (CNV)
#
# Installs OpenShift Virtualization and its HyperConverged instance.
# The overlay turns on software emulation (AWS nodes without .metal hardware).
#
# ArgoCD app:  operators-cnv   (argocd/appset-operators.yaml)
# Installs:    kubevirt-hyperconverged (channel stable, redhat-operators) into openshift-cnv
# ==============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Operator install — sync waves -3 (Namespace), -2 (OperatorGroup), -1 (Subscription).
  # ArgoCD waits for the Subscription to report AtLatestKnown before it moves on, so
  # everything below (wave 0 and up) is applied once the operator's CRDs exist.
  - namespace.yaml
  - operatorgroup.yaml
  - subscription.yaml
  # Operands
  - hyperconverged.yaml
