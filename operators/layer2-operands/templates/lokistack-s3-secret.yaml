{{- if and .Values.lokiStack .Values.lokiStack.enabled }}
---
# Placeholder Secret for LokiStack S3 credentials.
#
# ArgoCD will CREATE this secret on first sync (with placeholder values) but will
# NEVER overwrite it after that — ignoreDifferences on the Secret's data field in
# appset-operators.yaml prevents ArgoCD from touching the data after it is set.
#
# Update the real values via the OpenShift Web Console or CLI:
#   oc edit secret logging-loki-s3 -n openshift-logging
#
# See docs/tutorials/lokistack-s3-setup.md for full instructions.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.lokiStack.spec.storage.secret.name }}
  namespace: {{ .Values.lokiStack.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
stringData:
  access_key_id: "<enter_your_s3_access_key_id>"
  access_key_secret: "<enter_your_s3_secret_access_key>"
  bucketnames: "<enter_your_s3_bucket_name>"
  endpoint: "https://s3.ap-southeast-1.amazonaws.com"
  region: "ap-southeast-1"
{{- end }}
