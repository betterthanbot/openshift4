{{- if and .Values.maas .Values.maas.enabled }}
{{- $m := .Values.maas }}

{{- if and $m.tenant $m.tenant.enabled }}
---
# MaaS Tenant — the root object. The maas-controller reacts to this by wiring
# the gateway with its default AuthPolicy / TokenRateLimitPolicy (deny-all
# unless a subscription says otherwise) and by creating the per-tier namespaces.
apiVersion: maas.opendatahub.io/v1alpha1
kind: Tenant
metadata:
  name: {{ $m.tenant.name }}
  namespace: {{ $m.tenant.namespace }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  {{- toYaml $m.tenant.spec | nindent 2 }}
{{- end }}

{{- if and $m.subscriptions $m.subscriptions.enabled }}
{{- range $sub := $m.subscriptions.items }}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: {{ $sub.name }}
  namespace: {{ $m.subscriptions.namespace }}
  labels:
    {{- include "layer2-operands.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    openshift.io/display-name: {{ $sub.displayName | quote }}
spec:
  owner:
    groups:
      - name: {{ $sub.group | quote }}
  priority: {{ $sub.priority }}
  tokenMetadata:
    costCenter: {{ $sub.costCenter | quote }}
    organizationId: {{ $sub.organizationId | quote }}
  modelRefs:
    {{- range $ref := (default $m.subscriptions.defaultModelRefs $sub.modelRefs) }}
    - name: {{ $ref.name }}
      namespace: {{ $ref.namespace }}
      tokenRateLimits:
        - limit: {{ $sub.tokenLimit }}
          window: {{ $sub.tokenWindow }}
    {{- end }}
{{- end }}
{{- end }}

{{- if and $m.authPolicies $m.authPolicies.enabled }}
{{- $policies := $m.authPolicies.items }}
{{- if $m.authPolicies.fromSubscriptions }}
{{- $derived := list }}
{{- range $sub := $m.subscriptions.items }}
{{- $derived = append $derived (dict "name" (printf "%s-policy" $sub.name) "subscription" $sub.name "group" $sub.group "modelRefs" (default $m.subscriptions.defaultModelRefs $sub.modelRefs)) }}
{{- end }}
{{- $policies = concat $derived $m.authPolicies.items }}
{{- end }}
{{- range $p := $policies }}
---
# MaaSAuthPolicy — grants a group the right to call a set of models. The
# maas-controller expands this into the concrete Kuadrant AuthPolicy objects in
# each model's namespace (maas-auth-<model>), which is why those are not in git.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: {{ $p.name }}
  namespace: {{ $m.authPolicies.namespace }}
  labels:
    {{- include "layer2-operands.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    openshift.io/display-name: {{ $p.name | quote }}
    {{- if $p.subscription }}
    openshift.io/description: {{ printf "Auth policy created for subscription %q" $p.subscription | quote }}
    {{- end }}
spec:
  subjects:
    groups:
      - name: {{ $p.group | quote }}
  modelRefs:
    {{- range $ref := $p.modelRefs }}
    - name: {{ $ref.name }}
      namespace: {{ $ref.namespace }}
    {{- end }}
{{- end }}
{{- end }}

{{- if and $m.groups $m.groups.enabled }}
{{- range $grp := $m.groups.items }}
---
# Group shell only. `users` is deliberately omitted so ArgoCD never prunes real
# membership — populate from your IDP, or with bases/get-a-username.
apiVersion: user.openshift.io/v1
kind: Group
metadata:
  name: {{ $grp | quote }}
  labels:
    {{- include "layer2-operands.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/compare-options: IgnoreExtraneous
{{- end }}
{{- end }}

{{- end }}
