{{- if and .Values.maas .Values.maas.enabled .Values.maas.gatewayPolicies .Values.maas.gatewayPolicies.enabled }}
{{- $gp := .Values.maas.gatewayPolicies }}

{{- if $gp.rateLimitPolicy.enabled }}
---
# Per-tier REQUEST ceiling on the gateway (Limitador).
#
# Counted per authenticated user (auth.identity.userid), not per tier, so the
# limit is "each member of this tier gets N requests per window".
# `/v1/models` is excluded so model discovery is never rate limited.
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: {{ $gp.rateLimitPolicy.name }}
  namespace: {{ $gp.namespace }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
    opendatahub.io/dashboard: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ $gp.targetGateway }}
  limits:
    {{- range $name, $l := $gp.rateLimitPolicy.limits }}
    {{ $name }}:
      counters:
        - expression: auth.identity.userid
      rates:
        - limit: {{ $l.limit }}
          window: {{ $l.window }}
      when:
        - predicate: {{ printf "auth.identity.tier == %q && !request.path.endsWith(\"/v1/models\")" $l.tier | quote }}
    {{- end }}
{{- end }}

{{- if $gp.tokenRateLimitPolicy.enabled }}
---
# Per-tier TOKEN ceiling on the gateway. Same shape as the RateLimitPolicy
# above but counts LLM tokens rather than HTTP requests, which is what actually
# maps to cost.
apiVersion: kuadrant.io/v1alpha1
kind: TokenRateLimitPolicy
metadata:
  name: {{ $gp.tokenRateLimitPolicy.name }}
  namespace: {{ $gp.namespace }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
    opendatahub.io/dashboard: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ $gp.targetGateway }}
  limits:
    {{- range $name, $l := $gp.tokenRateLimitPolicy.limits }}
    {{ $name }}:
      counters:
        - expression: auth.identity.userid
      rates:
        - limit: {{ $l.limit }}
          window: {{ $l.window }}
      when:
        - predicate: {{ printf "auth.identity.tier == %q && !request.path.endsWith(\"/v1/models\")" $l.tier | quote }}
    {{- end }}
{{- end }}

{{- if $gp.telemetryPolicy.enabled }}
---
# Adds identity + subscription labels to the gateway's request metrics.
# These label names are what the MaaS Grafana dashboards in bases/grafana group
# by — change one here and the corresponding dashboard panel goes blank.
apiVersion: extensions.kuadrant.io/v1alpha1
kind: TelemetryPolicy
metadata:
  name: {{ $gp.telemetryPolicy.name }}
  namespace: {{ $gp.namespace }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: maas-observability
    maas.opendatahub.io/tenant-name: {{ .Values.maas.tenant.name }}
    maas.opendatahub.io/tenant-namespace: {{ .Values.maas.tenant.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ $gp.targetGateway }}
  metrics:
    default:
      labels:
        {{- range $k, $v := $gp.telemetryPolicy.labels }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
{{- end }}

{{- end }}
