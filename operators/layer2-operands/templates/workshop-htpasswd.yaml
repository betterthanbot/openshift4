{{- if .Values.workshopAuth.enabled }}
---
# HTPasswd file for workshop attendee accounts (user1..userN, created by
# bases/get-a-username/label-ns.sh). See workshopAuth in values.yaml for how
# to regenerate this when rotating the password or user count.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.workshopAuth.secretName }}
  namespace: openshift-config
type: Opaque
stringData:
  htpasswd: |
{{ .Values.workshopAuth.htpasswdContent | indent 4 }}
---
# OAuth is a cluster singleton, fully owned by this chart — any identity
# provider added manually outside git will be reverted on the next ArgoCD sync.
apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
spec:
  identityProviders:
    - name: {{ .Values.workshopAuth.identityProviderName }}
      mappingMethod: claim
      type: HTPasswd
      htpasswd:
        fileData:
          name: {{ .Values.workshopAuth.secretName }}
{{- end }}
