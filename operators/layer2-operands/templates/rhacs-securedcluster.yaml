{{- if and (dig "rhacs" "enabled" false .Values) (dig "rhacs" "securedCluster" "enabled" false .Values) }}
{{- $sc := .Values.rhacs.securedCluster }}
---
# RHACS SecuredCluster — registers this cluster's Sensor/Collector with Central.
# Prerequisite: Central must be up and the init bundle secret must exist.
# Generate the bundle from the RHACS console and apply it to the cluster before
# this resource is created.
apiVersion: platform.stackrox.io/v1alpha1
kind: SecuredCluster
metadata:
  name: {{ $sc.name }}
  namespace: {{ $sc.namespace }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
spec:
  clusterName: {{ $sc.clusterName | quote }}
{{- end }}
