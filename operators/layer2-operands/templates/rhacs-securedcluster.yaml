{{- if and .Values.rhacs .Values.rhacs.enabled .Values.rhacs.securedCluster .Values.rhacs.securedCluster.enabled }}
{{- $sc := .Values.rhacs.securedCluster }}
---
# RHACS SecuredCluster — registers this cluster's Sensor/Collector with Central.
# Prerequisite: a cluster registration secret (CRS) must exist in the `stackrox`
# namespace. The CRS is issued by Central, so generate it from the RHACS console
# and apply it to the cluster before this resource is created.
apiVersion: platform.stackrox.io/v1alpha1
kind: SecuredCluster
metadata:
  name: {{ $sc.name }}
  namespace: {{ $sc.namespace }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
spec:
  clusterName: {{ $sc.clusterName | quote }}
  {{- with $sc.centralEndpoint }}
  centralEndpoint: {{ . | quote }}
  {{- end }}
  {{- with $sc.sensor }}
  sensor:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
