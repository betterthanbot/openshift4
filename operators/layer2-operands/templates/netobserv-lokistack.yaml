{{- if and .Values.netobserv .Values.netobserv.enabled .Values.netobserv.lokiStack.enabled }}
{{- $l := .Values.netobserv.lokiStack }}
---
# LokiStack for Network Observability — required by FlowCollector.
# Prerequisite: the S3 secret named {{ $l.spec.storage.secret.name }}
# must exist in namespace {{ $l.namespace }} before this is applied.
apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: {{ $l.name }}
  namespace: {{ $l.namespace }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
spec:
  {{- toYaml $l.spec | nindent 2 }}
{{- end }}
