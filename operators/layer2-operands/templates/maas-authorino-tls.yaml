{{- if and .Values.maas .Values.maas.enabled .Values.maas.authorino .Values.maas.authorino.enabled }}
{{- $a := .Values.maas.authorino }}
---
# ------------------------------------------------------------------------------
# Authorino TLS — second half of the modelsAsService prerequisite pair.
#
# RHOAI's maas-controller refuses to start ModelsAsService unless some Authorino
# instance serves its authorization gRPC listener over TLS:
#
#   "Authorino TLS is not configured: no Authorino instance has
#    listener.tls.enabled=true with a certSecretRef."
#
# The rhcl/kuadrant operator creates the Authorino CR from the Kuadrant CR
# (maas-kuadrant.yaml, wave 1) with TLS OFF, and exposes no field on Kuadrant to
# turn it on — so the listener config has to be set on the Authorino object
# itself. Reference state captured from the working source cluster is in
# dumps/authorino.yaml; values.yaml mirrors it field-for-field.
#
# ORDERING IS LOAD-BEARING. The Certificate is wave 1 and the Authorino CR is
# wave 2 on purpose: flipping listener.tls.enabled before the Secret exists
# leaves the authorino Deployment in CreateContainerConfigError, unable to mount
# a volume that isn't there.
# ------------------------------------------------------------------------------
{{- if $a.certificate.enabled }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $a.certificate.issuerName }}
  namespace: {{ $a.namespace }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Self-signed rather than the sandbox's letsencrypt ClusterIssuer: this cert
  # is only ever presented on an in-cluster ClusterIP service to in-cluster
  # callers, so a public CA buys nothing and would need a real DNS name.
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $a.certificate.secretName }}
  namespace: {{ $a.namespace }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretName: {{ $a.certificate.secretName }}
  duration: {{ $a.certificate.duration }}
  renewBefore: {{ $a.certificate.renewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 256
    # Authorino does not reload its listener cert in place, so rotation needs a
    # pod restart either way; rotating the key on renewal costs nothing extra.
    rotationPolicy: Always
  issuerRef:
    name: {{ $a.certificate.issuerName }}
    kind: Issuer
    group: cert-manager.io
  commonName: {{ $a.serviceName }}.{{ $a.namespace }}.svc
  # Both forms: callers inside the cluster may dial either, and a SAN mismatch
  # is indistinguishable from a broken CA in Envoy's ext_authz logs.
  dnsNames:
    - {{ $a.serviceName }}.{{ $a.namespace }}.svc
    - {{ $a.serviceName }}.{{ $a.namespace }}.svc.cluster.local
{{- end }}
---
apiVersion: operator.authorino.kuadrant.io/v1beta1
kind: Authorino
metadata:
  name: {{ $a.name }}
  namespace: {{ $a.namespace }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # The kuadrant operator normally creates this object; we are adopting it.
    # ServerSideApply lets us own only the fields below and leave the operator's
    # own fields (and its finalizer) intact instead of Replace-ing the object.
    argocd.argoproj.io/sync-options: ServerSideApply=true,SkipDryRunOnMissingResource=true
spec:
  {{- toYaml $a.spec | nindent 2 }}
{{- end }}
