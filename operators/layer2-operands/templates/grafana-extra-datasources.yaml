{{- if and .Values.grafana .Values.grafana.enabled .Values.grafana.extraDatasources .Values.grafana.extraDatasources.enabled }}
{{- $e := .Values.grafana.extraDatasources }}
{{- range $ds := $e.items }}
---
# Wave 2, same as the Thanos datasource: created before the grafana-auth-job
# (wave 3) so the job can find and patch the ones that want a bearer token.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: {{ $ds.name }}
  namespace: {{ $e.namespace }}
  labels:
    {{- include "layer2-operands.labels" $ | nindent 4 }}
    {{- if not $ds.bearerTokenAuth }}
    # Read by the grafana-auth-job to decide what to skip.
    grafana.openshift4/auth: none
    {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  allowCrossNamespaceImport: false
  instanceSelector:
    matchLabels:
      dashboards: {{ $e.instanceLabel }}
  {{- if $ds.secretName }}
  valuesFrom:
    - targetPath: secureJsonData.password
      valueFrom:
        secretKeyRef:
          name: {{ $ds.secretName }}
          key: {{ $ds.secretKey }}
  {{- end }}
  datasource:
    name: {{ $ds.datasourceName | quote }}
    type: {{ $ds.type }}
    access: {{ $ds.access }}
    url: {{ $ds.url | quote }}
    isDefault: {{ $ds.isDefault }}
    {{- with $ds.database }}
    database: {{ . }}
    {{- end }}
    {{- with $ds.user }}
    user: {{ . }}
    {{- end }}
    {{- with $ds.jsonData }}
    jsonData:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if $ds.secretName }}
    secureJsonData:
      password: ${PASSWORD}
    {{- end }}
{{- end }}

{{- range $ds := $e.items }}
{{- if $ds.secretName }}
---
# Placeholder credential Secret — same pattern as the LokiStack S3 secrets.
# ArgoCD creates it empty-ish on first sync; fill it in with the real password
# and the Grafana operator picks it up on the next reconcile:
#
#   oc create secret generic {{ $ds.secretName }} -n {{ $e.namespace }} \
#     --from-literal={{ $ds.secretKey }}="$(oc get secret maas-postgres \
#       -n redhat-ods-applications -o jsonpath='{.data.database-password}' | base64 -d)" \
#     --dry-run=client -o yaml | oc apply -f -
#
# CreateOnly + IgnoreExtraneous stop ArgoCD resetting it back to the placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $ds.secretName }}
  namespace: {{ $e.namespace }}
  labels:
    {{- include "layer2-operands.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
type: Opaque
stringData:
  {{ $ds.secretKey }}: "CHANGE_ME"
{{- end }}
{{- end }}
{{- end }}
