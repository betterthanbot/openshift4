{{- if and .Values.grafana .Values.grafana.enabled .Values.grafana.datasource .Values.grafana.datasource.enabled }}
{{- $d := .Values.grafana.datasource }}
---
# Wave 2: GrafanaDatasource CR. secureJsonData is intentionally omitted here —
# the grafana-auth-job (wave 1) patches it directly after creating the token.
# ArgoCD ignoreDifferences on /spec/datasource/secureJsonData prevents syncs
# from clearing the patched value.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: {{ $d.name }}
  namespace: {{ $d.namespace }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  instanceSelector:
    matchLabels:
      dashboards: {{ $d.instanceLabel }}
  datasource:
    name: {{ $d.datasourceName }}
    type: prometheus
    access: proxy
    url: {{ $d.url }}
    isDefault: true
    jsonData:
      timeInterval: 5s
      tlsSkipVerify: true
      httpHeaderName1: "Authorization"
{{- end }}
