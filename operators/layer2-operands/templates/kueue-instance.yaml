{{- if and .Values.kueue .Values.kueue.enabled .Values.kueue.instance .Values.kueue.instance.enabled }}
{{- $k := .Values.kueue.instance }}
---
# Cluster-scoped Kueue instance, owned by the standalone Red Hat Kueue operator
# (layer1-install: kueueOperator).
#
# Do NOT also set rhods.dataScientCluster.components.kueue.managementState to
# Managed — RHOAI would then create its own Kueue and the two controllers race
# over the same kueue.x-k8s.io CRDs.
#
# cert-manager must be available: the operator issues its webhook, metrics and
# visibility-server certificates through it and reports CertManagerAvailable in
# this CR's status.
apiVersion: kueue.openshift.io/v1
kind: Kueue
metadata:
  name: {{ $k.name }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  {{- toYaml $k.spec | nindent 2 }}
{{- end }}
