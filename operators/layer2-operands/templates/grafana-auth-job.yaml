{{- if and .Values.grafana .Values.grafana.enabled .Values.grafana.serviceAccount .Values.grafana.serviceAccount.enabled }}
{{- $sa := .Values.grafana.serviceAccount }}
---
# Sync-hook Job (wave 1): mints a TokenRequest token for grafana-sa with
# audience=thanos-querier so the Thanos kube-rbac-proxy accepts it.
#
# Why not use a kubernetes.io/service-account-token Secret?
# The Thanos kube-rbac-proxy validates tokens with --auth-token-audiences=thanos-querier.
# Legacy SA token Secrets carry a generic audience and fail that check (401).
# oc create token issues via the TokenRequest API with the exact audience required.
#
# BeforeHookCreation re-runs this on every ArgoCD sync, keeping the token fresh
# within its --duration window.
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-create-thanos-auth
  namespace: {{ $sa.namespace }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: {{ $sa.tokenBuilderSA }}
      restartPolicy: OnFailure
      containers:
        - name: builder
          image: {{ $sa.tokenBuilderImage }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              TOKEN=$(oc create token {{ $sa.name }} \
                -n {{ $sa.namespace }} \
                --duration {{ $sa.tokenDuration }})

              oc create secret generic {{ $sa.authSecretName }} \
                --from-literal=bearer-token="Bearer ${TOKEN}" \
                -n {{ $sa.namespace }} \
                --dry-run=client -o yaml | oc apply -f -

              echo "Done: {{ $sa.authSecretName }} refreshed"
{{- end }}
