{{- if and .Values.grafana .Values.grafana.enabled .Values.grafana.serviceAccount .Values.grafana.serviceAccount.enabled }}
{{- $sa := .Values.grafana.serviceAccount }}
---
# Sync-hook Job (wave 1): creates a 7440h (310-day) TokenRequest token for grafana-sa,
# writes it to grafana-thanos-auth Secret, then patches all GrafanaDatasource CRs with
# the token directly in spec.datasource.secureJsonData. The patch triggers Grafana Operator
# reconciliation, which pushes the token to Grafana. ArgoCD ignoreDifferences on
# /spec/datasource/secureJsonData prevents subsequent syncs from clearing it.
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-create-thanos-auth
  namespace: {{ $sa.namespace }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: {{ $sa.tokenBuilderSA }}
      restartPolicy: OnFailure
      containers:
        - name: builder
          image: {{ $sa.tokenBuilderImage }}
          command:
            - /bin/sh
            - -c
            - |
              set -e

              TOKEN=$(oc create token {{ $sa.name }} \
                -n {{ $sa.namespace }} \
                --duration=7440h)

              if [ -z "$TOKEN" ]; then
                echo "ERROR: oc create token returned empty token"
                exit 1
              fi

              # Write to Secret for reference / debugging
              oc create secret generic {{ $sa.authSecretName }} \
                --from-literal=bearer-token="Bearer ${TOKEN}" \
                -n {{ $sa.namespace }} \
                --dry-run=client -o yaml | oc apply -f -

              # Patch secureJsonData directly into each GrafanaDatasource CR.
              # This triggers the Grafana Operator to reconcile and push the token
              # to Grafana via its API. ArgoCD ignoreDifferences prevents syncs
              # from resetting this field back to empty.
              for CR in $(oc get grafanadatasource -n {{ $sa.namespace }} -o name); do
                oc patch "${CR}" -n {{ $sa.namespace }} \
                  --type merge \
                  -p "{\"spec\":{\"datasource\":{\"secureJsonData\":{\"httpHeaderValue1\":\"Bearer ${TOKEN}\"}}}}"
                echo "Patched: ${CR}"
              done

              echo "Done: all GrafanaDatasource CRs patched with fresh bearer token"
{{- end }}
