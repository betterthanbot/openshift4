{{- if and .Values.grafana .Values.grafana.enabled .Values.grafana.serviceAccount .Values.grafana.serviceAccount.enabled }}
{{- $sa := .Values.grafana.serviceAccount }}
---
# Sync-hook Job (wave 1): reads the SA token, prepends "Bearer ", writes it to a
# derived Secret so GrafanaDatasource can use targetPath without losing the prefix.
# Runs on every ArgoCD sync (BeforeHookCreation deletes the previous Job first),
# which also refreshes the token in case it was rotated.
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-create-thanos-auth
  namespace: {{ $sa.namespace }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: {{ $sa.tokenBuilderSA }}
      restartPolicy: OnFailure
      containers:
        - name: builder
          image: {{ $sa.tokenBuilderImage }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # Wait for the token key to be populated by the API server
              for i in $(seq 1 30); do
                TOKEN=$(cat /var/run/secrets/grafana-sa-token/token 2>/dev/null || true)
                [ -n "$TOKEN" ] && break
                echo "Waiting for token... ($i/30)"
                sleep 3
              done
              [ -z "$TOKEN" ] && echo "ERROR: token not populated after 90s" && exit 1

              oc create secret generic {{ $sa.authSecretName }} \
                --from-literal=bearer-token="Bearer ${TOKEN}" \
                -n {{ $sa.namespace }} \
                --dry-run=client -o yaml | oc apply -f -

              echo "Done: {{ $sa.authSecretName }} is up to date"
          volumeMounts:
            - name: grafana-sa-token
              mountPath: /var/run/secrets/grafana-sa-token
              readOnly: true
      volumes:
        - name: grafana-sa-token
          secret:
            secretName: {{ $sa.tokenSecretName }}
{{- end }}
