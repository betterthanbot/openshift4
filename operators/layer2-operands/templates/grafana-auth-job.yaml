{{- if and .Values.grafana .Values.grafana.enabled .Values.grafana.serviceAccount .Values.grafana.serviceAccount.enabled }}
{{- $sa := .Values.grafana.serviceAccount }}
---
# Sync-hook Job (wave 1): creates a 7440h (310-day) TokenRequest token for grafana-sa
# and writes it with a "Bearer " prefix into grafana-thanos-auth.
# After updating the Secret, the Job annotates all GrafanaDatasource CRs so the Grafana
# Operator reconciles them immediately and picks up the new token value.
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-create-thanos-auth
  namespace: {{ $sa.namespace }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: {{ $sa.tokenBuilderSA }}
      restartPolicy: OnFailure
      containers:
        - name: builder
          image: {{ $sa.tokenBuilderImage }}
          command:
            - /bin/sh
            - -c
            - |
              set -e

              TOKEN=$(oc create token {{ $sa.name }} \
                -n {{ $sa.namespace }} \
                --duration=7440h)

              if [ -z "$TOKEN" ]; then
                echo "ERROR: oc create token returned empty token"
                exit 1
              fi

              oc create secret generic {{ $sa.authSecretName }} \
                --from-literal=bearer-token="Bearer ${TOKEN}" \
                -n {{ $sa.namespace }} \
                --dry-run=client -o yaml | oc apply -f -

              # Annotate GrafanaDatasource CRs so the Grafana Operator reconciles and
              # picks up the new token from grafana-thanos-auth immediately.
              oc annotate grafanadatasource -n {{ $sa.namespace }} --all \
                grafana-operator/last-auth-refresh="$(date -u +%s)" \
                --overwrite

              echo "Done: {{ $sa.authSecretName }} refreshed, datasources triggered"
{{- end }}
