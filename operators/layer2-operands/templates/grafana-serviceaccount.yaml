{{- if and .Values.grafana .Values.grafana.enabled .Values.grafana.serviceAccount .Values.grafana.serviceAccount.enabled }}
{{- $sa := .Values.grafana.serviceAccount }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name }}
  namespace: {{ $sa.namespace }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
---
# Long-lived token so the GrafanaDatasource can reference it without rotation issues.
# The `token` key is auto-populated by the API server once the SA exists.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $sa.tokenSecretName }}
  namespace: {{ $sa.namespace }}
  annotations:
    kubernetes.io/service-account.name: {{ $sa.name }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
type: kubernetes.io/service-account-token
---
# Grants the SA read access to all metrics in OpenShift monitoring (Thanos querier).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-cluster-monitoring-view
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa.name }}
    namespace: {{ $sa.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
{{- end }}
