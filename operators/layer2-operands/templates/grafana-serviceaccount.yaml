{{- if and .Values.grafana .Values.grafana.enabled .Values.grafana.serviceAccount .Values.grafana.serviceAccount.enabled }}
{{- $sa := .Values.grafana.serviceAccount }}
---
# Identity used by Grafana to query Thanos and LokiStack. The bearer token for this SA
# is stored in grafana-thanos-auth Secret and injected into all GrafanaDatasource CRs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name }}
  namespace: {{ $sa.namespace }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
---
# Grants the SA read access to all metrics in OpenShift monitoring (Thanos querier).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-cluster-monitoring-view
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa.name }}
    namespace: {{ $sa.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
---
# ServiceAccount used by the sync-hook Job to read grafana-sa-token and write grafana-thanos-auth.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.tokenBuilderSA }}
  namespace: {{ $sa.namespace }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-token-builder
  namespace: {{ $sa.namespace }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
rules:
  # Read the long-lived SA token Secret and write the bearer token to grafana-thanos-auth
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
  # Annotate GrafanaDatasource CRs after Secret update to trigger Grafana Operator reconciliation
  - apiGroups: ["grafana.integreatly.org"]
    resources: ["grafanadatasources"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-token-builder
  namespace: {{ $sa.namespace }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa.tokenBuilderSA }}
    namespace: {{ $sa.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-token-builder
---
# Grants grafana-sa read access to all LokiStack log tenants (application, infrastructure,
# audit). cluster-admin is required because the LokiStack OPA gateway enforces audit log
# access via elevated privilege checks; scoped pod/log RBAC only covers app + infra.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-sa-cluster-admin
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa.name }}
    namespace: {{ $sa.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
# Long-lived non-expiring SA token Secret. Kubernetes auto-populates the `token` field.
# Used by the grafana-auth-job to write the bearer token to grafana-thanos-auth.
# This avoids the kube-apiserver maxTokenExpiration cap that affects `oc create token`.
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: {{ $sa.name }}-token
  namespace: {{ $sa.namespace }}
  annotations:
    kubernetes.io/service-account.name: {{ $sa.name }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
{{- end }}
