{{- if and .Values.grafana .Values.grafana.enabled .Values.grafana.serviceAccount .Values.grafana.serviceAccount.enabled }}
{{- $sa := .Values.grafana.serviceAccount }}
---
# Identity used to query Thanos. The token is issued by the Job (not a static Secret)
# so it carries the correct audience for the Thanos kube-rbac-proxy.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name }}
  namespace: {{ $sa.namespace }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
---
# Grants the SA read access to all metrics in OpenShift monitoring (Thanos querier).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-cluster-monitoring-view
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa.name }}
    namespace: {{ $sa.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
---
# ServiceAccount used by the sync-hook Job that mints the thanos-audience token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.tokenBuilderSA }}
  namespace: {{ $sa.namespace }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-token-builder
  namespace: {{ $sa.namespace }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
rules:
  # Create a token for grafana-sa with the correct audience via TokenRequest API
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
    resourceNames: ["{{ $sa.name }}"]
  # Write the resulting bearer token into the auth secret
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-token-builder
  namespace: {{ $sa.namespace }}
  labels:
    {{- include "layer2-operands.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa.tokenBuilderSA }}
    namespace: {{ $sa.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-token-builder
{{- end }}
