# ==============================================================================
# layer1-install values
# Each operator entry drives Namespace + OperatorGroup + Subscription creation.
#
# Fields:
#   enabled                    - toggle the entire operator on/off
#   namespace.create           - false if the namespace already exists in OCP
#   namespace.name             - namespace to install the operator into
#   namespace.labels           - extra labels to apply to the namespace
#   operatorGroup.create       - false if a global OG already covers this NS
#   operatorGroup.name         - OperatorGroup resource name
#   operatorGroup.targetNamespaces - [] means watch all namespaces (OwnNamespace
#                                   = list the namespace; AllNamespaces = [])
#   subscription.name          - OLM package name (also the Subscription name)
#   subscription.namespace     - must match namespace.name
#   subscription.channel       - operator channel to track
#   subscription.source        - CatalogSource name
#   subscription.installPlanApproval - Automatic | Manual
#   subscription.startingCSV   - pin to a specific CSV version; "" = latest
# ==============================================================================

operators:

  # ----------------------------------------------------------------------------
  # Grafana (Community)
  # ----------------------------------------------------------------------------
  grafana:
    enabled: true
    namespace:
      create: true
      name: grafana
      labels:
        kubernetes.io/metadata.name: grafana
    operatorGroup:
      create: true
      name: grafana
      targetNamespaces: []   # AllNamespaces
    subscription:
      name: grafana-operator
      namespace: grafana
      channel: v5
      source: community-operators
      installPlanApproval: Automatic
      startingCSV: "grafana-operator.v5.24.0"

  # ----------------------------------------------------------------------------
  # NVIDIA GPU Operator (Certified)
  # ----------------------------------------------------------------------------
  gpuOperator:
    enabled: true
    namespace:
      create: true
      name: nvidia-gpu-operator
      labels:
        kubernetes.io/metadata.name: nvidia-gpu-operator
        openshift.io/cluster-monitoring: "true"
    operatorGroup:
      create: true
      name: nvidia-gpu-operator
      targetNamespaces:
        - nvidia-gpu-operator
    subscription:
      name: gpu-operator-certified
      namespace: nvidia-gpu-operator
      channel: v26.3
      source: certified-operators
      installPlanApproval: Automatic
      startingCSV: "gpu-operator-certified.v26.3.3"

  # ----------------------------------------------------------------------------
  # Cluster Observability Operator (Red Hat)
  # ----------------------------------------------------------------------------
  clusterObservability:
    enabled: true
    namespace:
      create: true
      name: openshift-cluster-observability-operator
      labels:
        kubernetes.io/metadata.name: openshift-cluster-observability-operator
        openshift.io/cluster-monitoring: "true"
        security.openshift.io/scc.podSecurityLabelSync: "true"
    operatorGroup:
      create: true
      name: openshift-cluster-observability-operator
      targetNamespaces: []   # AllNamespaces
    subscription:
      name: cluster-observability-operator
      namespace: openshift-cluster-observability-operator
      channel: stable
      source: redhat-operators
      installPlanApproval: Automatic
      startingCSV: "cluster-observability-operator.v1.5.1"

  # ----------------------------------------------------------------------------
  # Compliance Operator (Red Hat)
  # ----------------------------------------------------------------------------
  complianceOperator:
    enabled: true
    namespace:
      create: true
      name: openshift-compliance
      labels:
        kubernetes.io/metadata.name: openshift-compliance
        security.openshift.io/scc.podSecurityLabelSync: "true"
    operatorGroup:
      create: true
      name: openshift-compliance
      targetNamespaces: []   # AllNamespaces
    subscription:
      name: compliance-operator
      namespace: openshift-compliance
      channel: stable
      source: redhat-operators
      installPlanApproval: Automatic
      startingCSV: "compliance-operator.v1.9.1"

  # ----------------------------------------------------------------------------
  # OpenShift GitOps (Red Hat)
  # ----------------------------------------------------------------------------
  gitopsOperator:
    enabled: false
    namespace:
      create: true
      name: openshift-gitops-operator
      labels:
        kubernetes.io/metadata.name: openshift-gitops-operator
        openshift.io/cluster-monitoring: "true"
        security.openshift.io/scc.podSecurityLabelSync: "true"
    operatorGroup:
      create: true
      name: openshift-gitops-operator
      targetNamespaces: []   # AllNamespaces
    subscription:
      name: openshift-gitops-operator
      namespace: openshift-gitops-operator
      channel: latest
      source: redhat-operators
      installPlanApproval: Automatic
      startingCSV: "openshift-gitops-operator.v1.21.1"

  # ----------------------------------------------------------------------------
  # Kernel Module Management Hub (Red Hat)
  # ----------------------------------------------------------------------------
  kmmHub:
    enabled: false
    namespace:
      create: true
      name: openshift-kmm-hub
      labels:
        kubernetes.io/metadata.name: openshift-kmm-hub
        security.openshift.io/scc.podSecurityLabelSync: "true"
    operatorGroup:
      create: true
      name: openshift-kmm-hub
      targetNamespaces:
        - openshift-kmm-hub
    subscription:
      name: kernel-module-management-hub
      namespace: openshift-kmm-hub
      channel: stable
      source: redhat-operators
      installPlanApproval: Automatic
      startingCSV: "kernel-module-management-hub.v2.6.1"

  # ----------------------------------------------------------------------------
  # Cluster Logging (Red Hat)
  # ----------------------------------------------------------------------------
  clusterLogging:
    enabled: true
    namespace:
      create: true
      name: openshift-logging
      labels:
        kubernetes.io/metadata.name: openshift-logging
        openshift.io/cluster-monitoring: "true"
        security.openshift.io/scc.podSecurityLabelSync: "true"
    operatorGroup:
      create: true
      name: openshift-logging
      targetNamespaces: []   # AllNamespaces
    subscription:
      name: cluster-logging
      namespace: openshift-logging
      channel: stable-6.4
      source: redhat-operators
      installPlanApproval: Automatic
      startingCSV: "cluster-logging.v6.4.6"

  # ----------------------------------------------------------------------------
  # Node Feature Discovery (Red Hat)
  # ----------------------------------------------------------------------------
  nfd:
    enabled: true
    namespace:
      create: true
      name: openshift-nfd
      labels:
        kubernetes.io/metadata.name: openshift-nfd
        openshift.io/cluster-monitoring: "true"
        security.openshift.io/scc.podSecurityLabelSync: "true"
    operatorGroup:
      create: true
      name: openshift-nfd
      targetNamespaces:
        - openshift-nfd
    subscription:
      name: nfd
      namespace: openshift-nfd
      channel: stable
      source: redhat-operators
      installPlanApproval: Automatic
      startingCSV: "nfd.4.20.0-202607171900"

  # ----------------------------------------------------------------------------
  # Loki Operator (Red Hat)
  # openshift-operators-redhat is a standard OCP namespace for RH operators
  # that require their own OperatorGroup (not the global one).
  # ----------------------------------------------------------------------------
  lokiOperator:
    enabled: true
    namespace:
      create: true
      name: openshift-operators-redhat
      labels:
        kubernetes.io/metadata.name: openshift-operators-redhat
        openshift.io/cluster-monitoring: "true"
        security.openshift.io/MinimallySufficientPodSecurityStandard: restricted
        security.openshift.io/scc.podSecurityLabelSync: "true"
    operatorGroup:
      create: true
      name: openshift-operators-redhat
      targetNamespaces: []   # AllNamespaces
    subscription:
      name: loki-operator
      namespace: openshift-operators-redhat
      channel: stable-6.4
      source: redhat-operators
      installPlanApproval: Automatic
      startingCSV: "loki-operator.v6.4.6"

  # ----------------------------------------------------------------------------
  # DevWorkspace Operator (Red Hat)
  # Installs into openshift-operators which already exists in OCP and already
  # has the "global-operators" OperatorGroup — no Namespace/OG creation needed.
  # ----------------------------------------------------------------------------
  devWorkspace:
    enabled: false
    namespace:
      create: false   # openshift-operators is a built-in OCP namespace
      name: openshift-operators
    operatorGroup:
      create: false   # global-operators OG already exists
    subscription:
      name: devworkspace-operator
      namespace: openshift-operators
      channel: fast
      source: redhat-operators
      installPlanApproval: Manual
      startingCSV: "devworkspace-operator.v0.41.0"

  # ----------------------------------------------------------------------------
  # Red Hat OpenShift AI / RHODS (Red Hat)
  # ----------------------------------------------------------------------------
  rhodsOperator:
    enabled: true
    namespace:
      create: true
      name: redhat-ods-operator
      labels:
        kubernetes.io/metadata.name: redhat-ods-operator
    operatorGroup:
      create: true
      name: redhat-ods-operator
      targetNamespaces: []   # AllNamespaces
    subscription:
      name: rhods-operator
      namespace: redhat-ods-operator
      channel: stable-3.4
      source: redhat-operators
      installPlanApproval: Automatic
      startingCSV: "rhods-operator.3.4.2"

  # ----------------------------------------------------------------------------
  # Network Observability (Red Hat)
  # FlowCollector is cluster-scoped — operator needs AllNamespaces OG.
  # ----------------------------------------------------------------------------
  netobserv:
    enabled: true
    namespace:
      create: true
      name: netobserv
      labels:
        kubernetes.io/metadata.name: netobserv
        openshift.io/cluster-monitoring: "true"
        security.openshift.io/scc.podSecurityLabelSync: "true"
    operatorGroup:
      create: true
      name: netobserv
      targetNamespaces: []   # AllNamespaces — FlowCollector is cluster-scoped
    subscription:
      name: netobserv-operator
      namespace: netobserv
      channel: stable
      source: redhat-operators
      installPlanApproval: Automatic
      startingCSV: "network-observability-operator.v1.12.1"

  # ----------------------------------------------------------------------------
  # OpenShift Virtualization / CNV (Red Hat)
  #
  # A previous manual install of this operator was torn down with
  # operators/cleanup-cnv-stale.sh (its Subscription/CSV had been deleted
  # without a clean uninstall, orphaning all operand Deployments — see
  # PLAN.md Known Issue #8). This entry is a from-scratch install.
  #
  # This cluster's nodes (m6a.4xlarge on AWS) are not bare-metal, so they have
  # no /dev/kvm and no vmx/svm CPU flags — AWS only exposes hardware
  # virtualization on .metal instance types. VMs run via QEMU software
  # emulation instead (see layer2-operands HyperConverged CR annotation).
  # See docs/tutorials/openshift-virtualization-on-ec2.md.
  # ----------------------------------------------------------------------------
  cnvOperator:
    enabled: true   # set false to uninstall (also disable layer2-operands cnv)
    namespace:
      create: true
      name: openshift-cnv
      labels:
        kubernetes.io/metadata.name: openshift-cnv
        openshift.io/cluster-monitoring: "true"
        security.openshift.io/scc.podSecurityLabelSync: "true"
    operatorGroup:
      create: true
      name: openshift-cnv
      targetNamespaces:
        - openshift-cnv
    subscription:
      name: kubevirt-hyperconverged
      namespace: openshift-cnv
      channel: stable
      source: redhat-operators
      installPlanApproval: Automatic
      startingCSV: "kubevirt-hyperconverged-operator.v4.20.21"

  # ----------------------------------------------------------------------------
  # Red Hat Advanced Cluster Security (RHACS) (Red Hat)
  # ----------------------------------------------------------------------------
  rhacsOperator:
    enabled: true
    namespace:
      create: true
      name: stackrox
      labels:
        kubernetes.io/metadata.name: stackrox
    operatorGroup:
      create: true
      name: stackrox
      targetNamespaces: []   # AllNamespaces
    subscription:
      name: rhacs-operator
      namespace: stackrox
      channel: stable
      source: redhat-operators
      installPlanApproval: Automatic
      startingCSV: "rhacs-operator.v4.11.2"

  # ----------------------------------------------------------------------------
  # Red Hat OpenShift Service Mesh 3 / Sail (Red Hat)
  #
  # Hard dependency of RHOAI 3.x KServe: the DSCInitialization creates a
  # GatewayConfig which in turn creates an `Istio` (sailoperator.io) CR named
  # `openshift-gateway` and the `data-science-gateway-class` GatewayClass.
  # Without this operator the data-science gateway never programs and every
  # LLMInferenceService stays unreachable.
  #
  # Installs into openshift-operators (built-in NS, global-operators OG).
  # NOTE: the source cluster had installPlanApproval: Manual. Automatic +
  # a pinned startingCSV is used here so a fresh bootstrap completes unattended.
  # ----------------------------------------------------------------------------
  serviceMesh3:
    enabled: true
    namespace:
      create: false   # openshift-operators is a built-in OCP namespace
      name: openshift-operators
    operatorGroup:
      create: false   # global-operators OG already exists
    subscription:
      name: servicemeshoperator3
      namespace: openshift-operators
      channel: stable
      source: redhat-operators
      installPlanApproval: Automatic
      startingCSV: "servicemeshoperator3.v3.4.0"

  # ----------------------------------------------------------------------------
  # Red Hat Connectivity Link / Kuadrant (Red Hat)
  #
  # Provides the AuthPolicy / RateLimitPolicy / TokenRateLimitPolicy /
  # TelemetryPolicy CRDs that Models-as-a-Service builds on. Installing this
  # one Subscription is enough — OLM dependency resolution pulls in three more
  # operators into openshift-operators automatically, so they are deliberately
  # NOT declared here (declaring them would fight OLM's generated Subscriptions,
  # which are named "<pkg>-<channel>-<source>-openshift-marketplace"):
  #
  #   authorino-operator   (authorino-operator.v1.4.2)  — AuthConfig / Authorino
  #   limitador-operator   (limitador-operator.v1.4.1)  — rate limit counters
  #   dns-operator         (dns-operator.v1.4.1)        — Kuadrant DNSPolicy
  #
  # The Kuadrant CR itself lives in layer2-operands (kuadrant-system namespace).
  # NOTE: source cluster used installPlanApproval: Manual — see serviceMesh3.
  # ----------------------------------------------------------------------------
  connectivityLink:
    enabled: true
    namespace:
      create: false   # openshift-operators is a built-in OCP namespace
      name: openshift-operators
    operatorGroup:
      create: false   # global-operators OG already exists
    subscription:
      name: rhcl-operator
      namespace: openshift-operators
      channel: stable
      source: redhat-operators
      installPlanApproval: Automatic
      startingCSV: "rhcl-operator.v1.4.2"

  # ----------------------------------------------------------------------------
  # Kueue (Red Hat)
  #
  # Standalone Kueue operator — job queueing / quota for AI workloads.
  # RHOAI's own `kueue` DSC component is set to Removed (see layer2-operands
  # rhods.dataScientCluster) because this operator manages the Kueue instance
  # instead. Requires cert-manager to be present (it issues the webhook and
  # metrics certs in openshift-kueue-operator).
  # ----------------------------------------------------------------------------
  kueueOperator:
    enabled: true
    namespace:
      create: true
      name: openshift-kueue-operator
      labels:
        kubernetes.io/metadata.name: openshift-kueue-operator
        openshift.io/cluster-monitoring: "true"
    operatorGroup:
      create: true
      name: openshift-kueue-operator
      targetNamespaces: []   # AllNamespaces
    subscription:
      name: kueue-operator
      namespace: openshift-kueue-operator
      channel: stable-v1.3
      source: redhat-operators
      installPlanApproval: Automatic
      startingCSV: "kueue-operator.v1.3.1"

  # ----------------------------------------------------------------------------
  # Leader Worker Set (Red Hat)
  #
  # Required for multi-node / disaggregated (prefill + decode) LLM serving —
  # the llm-d style LLMInferenceService worker topologies. Installed but no
  # LeaderWorkerSetOperator CR existed on the source cluster, so there is no
  # matching layer2 operand.
  # ----------------------------------------------------------------------------
  leaderWorkerSet:
    enabled: true
    namespace:
      create: true
      name: openshift-lws-operator
      labels:
        kubernetes.io/metadata.name: openshift-lws-operator
        openshift.io/cluster-monitoring: "true"
    operatorGroup:
      create: true
      name: openshift-lws-operator
      targetNamespaces:
        - openshift-lws-operator
    subscription:
      name: leader-worker-set
      namespace: openshift-lws-operator
      channel: stable-v1.0
      source: redhat-operators
      installPlanApproval: Automatic
      startingCSV: ""

  # ----------------------------------------------------------------------------
  # Red Hat build of OpenTelemetry
  #
  # Backs the RHOAI monitoring stack: DSCInitialization.spec.monitoring.metrics
  # /.traces makes the RHOAI operator create an OpenTelemetryCollector
  # ("data-science-collector") in redhat-ods-monitoring. Without this operator
  # the DSCI monitoring block never reconciles and no MaaS metrics are scraped.
  # ----------------------------------------------------------------------------
  openTelemetry:
    enabled: true
    namespace:
      create: true
      name: openshift-opentelemetry-operator
      labels:
        kubernetes.io/metadata.name: openshift-opentelemetry-operator
        openshift.io/cluster-monitoring: "true"
    operatorGroup:
      create: true
      name: openshift-opentelemetry-operator
      targetNamespaces: []   # AllNamespaces
    subscription:
      name: opentelemetry-product
      namespace: openshift-opentelemetry-operator
      channel: stable
      source: redhat-operators
      installPlanApproval: Automatic
      startingCSV: "opentelemetry-operator.v0.152.0-1"

  # ----------------------------------------------------------------------------
  # Red Hat build of Tempo
  #
  # Distributed tracing backend for RHOAI. DSCInitialization.spec.monitoring
  # .traces (storage.backend: pv) makes the RHOAI operator create a
  # TempoMonolithic ("data-science-tempomonolithic") in redhat-ods-monitoring.
  # ----------------------------------------------------------------------------
  tempo:
    enabled: true
    namespace:
      create: true
      name: openshift-tempo-operator
      labels:
        kubernetes.io/metadata.name: openshift-tempo-operator
        openshift.io/cluster-monitoring: "true"
    operatorGroup:
      create: true
      name: openshift-tempo-operator
      targetNamespaces: []   # AllNamespaces
    subscription:
      name: tempo-product
      namespace: openshift-tempo-operator
      channel: stable
      source: redhat-operators
      installPlanApproval: Automatic
      startingCSV: "tempo-operator.v0.21.0-3"

  # ----------------------------------------------------------------------------
  # cert-manager for Red Hat OpenShift
  #
  # DISABLED BY DEFAULT: the RHPDS/OPENTLC sandbox this platform was captured
  # from ships cert-manager pre-installed (Subscription created at cluster
  # provisioning time, before GitOps bootstrap) along with a
  # `letsencrypt-production-ec2` ClusterIssuer holding sandbox-specific Route53
  # credentials. That ClusterIssuer is intentionally NOT in this repo.
  #
  # Enable this if your cluster does NOT already ship cert-manager — the Kueue
  # operator requires it, and the MaaS gateway's TLS listener consumes a
  # `cert-manager-ingress-cert` Secret in openshift-ingress.
  # ----------------------------------------------------------------------------
  certManager:
    enabled: false
    namespace:
      create: true
      name: cert-manager-operator
      labels:
        kubernetes.io/metadata.name: cert-manager-operator
        openshift.io/cluster-monitoring: "true"
    operatorGroup:
      create: true
      name: cert-manager-operator
      targetNamespaces:
        - cert-manager-operator
    subscription:
      name: openshift-cert-manager-operator
      namespace: cert-manager-operator
      channel: stable-v1
      source: redhat-operators
      installPlanApproval: Automatic
      startingCSV: "cert-manager-operator.v1.20.0"

  # ----------------------------------------------------------------------------
  # OpenShift Lightspeed
  #
  # DISABLED BY DEFAULT: present on the source cluster but never configured —
  # no OLSConfig CR existed, so the operator sat idle. Flip to true and add an
  # OLSConfig if you want the in-console assistant.
  # ----------------------------------------------------------------------------
  lightspeed:
    enabled: false
    namespace:
      create: true
      name: openshift-lightspeed
      labels:
        kubernetes.io/metadata.name: openshift-lightspeed
    operatorGroup:
      create: true
      name: openshift-lightspeed
      targetNamespaces:
        - openshift-lightspeed
    subscription:
      name: lightspeed-operator
      namespace: openshift-lightspeed
      channel: stable
      source: redhat-operators
      installPlanApproval: Manual
      startingCSV: "lightspeed-operator.v1.1.1"

  # ----------------------------------------------------------------------------
  # Red Hat Quay
  #
  # DISABLED BY DEFAULT: present on the source cluster but never configured —
  # no QuayRegistry CR existed (the `quayregistry` namespace was created but
  # left empty). Quay is heavy; flip to true only if you actually want a
  # registry, and add a QuayRegistry operand.
  # ----------------------------------------------------------------------------
  quay:
    enabled: false
    namespace:
      create: false   # openshift-operators is a built-in OCP namespace
      name: openshift-operators
    operatorGroup:
      create: false   # global-operators OG already exists
    subscription:
      name: quay-operator
      namespace: openshift-operators
      channel: stable-3.17
      source: redhat-operators
      installPlanApproval: Manual
      startingCSV: "quay-operator.v3.17.3"

# ==============================================================================
# extraNamespaces — namespaces that hold operands but are not the install
# namespace of any operator above. Created in wave 1 so layer2-operands
# (wave 2) always has somewhere to put its CRs.
# ==============================================================================
extraNamespaces:
  - name: kuadrant-system
    labels:
      kubernetes.io/metadata.name: kuadrant-system
      openshift.io/cluster-monitoring: "true"

  # Normally created by the RHOAI maas-controller once the DSC's
  # kserve.modelsAsService component goes Managed. Declared here anyway so the
  # layer2 Tenant / MaaSSubscription / MaaSAuthPolicy CRs never race a missing
  # namespace on a cold bootstrap. Only metadata.name is set — the controller
  # owns the rest of the labels.
  - name: models-as-a-service
    labels:
      kubernetes.io/metadata.name: models-as-a-service

  # Namespace the demo models are served from. Also referenced by
  # overlay/my-sno-cluster/model-serving.
  - name: vllm-project
    labels:
      kubernetes.io/metadata.name: vllm-project
      opendatahub.io/dashboard: "true"
      openshift.io/cluster-monitoring: "true"
