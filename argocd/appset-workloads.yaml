# ==============================================================================
# ApplicationSet: openshift4-workloads
#
# Uses ArgoCD's Git directory generator to automatically discover every
# subdirectory under overlay/my-sno-cluster/ and create a separate ArgoCD
# Application for each one.
#
# This replaces the old single "my-sno-cluster" Application that lumped
# everything together. Now each component (grafana, gatus, kyverno, …)
# appears as its own Application in the ArgoCD UI.
#
# Adding a new workload:
#   1. Create  overlay/my-sno-cluster/<name>/kustomization.yaml
#   2. Push to main — ArgoCD auto-discovers and creates the Application.
#      No changes to this file required.
#
# Sync-wave 3 ensures workloads deploy after operators (waves 1 & 2).
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: openshift4-workloads
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - git:
        repoURL: https://github.com/betterthanbot/openshift4.git
        revision: argocd/demo
        directories:
          # Each subdirectory here becomes one ArgoCD Application.
          # Add new workloads by creating overlay/my-sno-cluster/<name>/kustomization.yaml
          - path: overlay/my-sno-cluster/*
          # To disable a workload without deleting the folder, add it here with exclude: true
          - path: overlay/my-sno-cluster/kyverno
            exclude: true
          - path: overlay/my-sno-cluster/get-a-username
            exclude: true
        # template:
        #   metadata:
        #     annotations:
        #       exclude: "true"

  template:
    metadata:
      name: "{{ .path.basename }}"
      namespace: openshift-gitops
      annotations:
        argocd.argoproj.io/sync-wave: "3"
    spec:
      project: openshift4-community

      source:
        repoURL: https://github.com/betterthanbot/openshift4.git
        targetRevision: argocd/demo
        path: "{{ .path.path }}"
        # ArgoCD auto-detects kustomize (kustomization.yaml present)
        # or Helm (Chart.yaml present) — no explicit config needed

      destination:
        server: https://kubernetes.default.svc
        # Individual kustomization.yaml files set their own namespace via
        # the 'namespace:' field; this is a fallback default.
        namespace: default

      syncPolicy:
        # automated:
        #   prune: true
        #   selfHeal: true
        allowEmpty: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - RespectIgnoreDifferences=true
          # Same reasoning as argocd/appset-operators.yaml — see the long note
          # there. ArgoCD rejects an entire sync up front if any rendered kind is
          # unknown to the cluster, and `model-serving` is made almost entirely
          # of kinds that only exist after the RHOAI DataScienceCluster has
          # reconciled: serving.kserve.io (LLMInferenceService,
          # LLMInferenceServiceConfig, InferenceService, ServingRuntime) and
          # llamastack.io (LlamaStackDistribution).
          - SkipDryRunOnMissingResource=true
        retry:
          # Workloads land after operators AND operands, so give them room —
          # a model-serving sync attempted before the DSC has registered the
          # KServe CRDs should keep retrying rather than give up.
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 3m

      ignoreDifferences:
        # Gatus config is generated at runtime by the discovery CronJob
        - group: ""
          kind: ConfigMap
          name: gatus-config
          namespace: gatus
          jsonPointers:
            - /data
        # get-a-username secret — placeholder is committed; real password is set
        # manually via `oc edit`, never committed to git.
        - group: ""
          kind: Secret
          name: get-a-username-secret
          namespace: guides
          jsonPointers:
            - /data
