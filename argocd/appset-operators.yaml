# ==============================================================================
# ApplicationSet: openshift4-operators
#
# Manages the two-layer OLM operator installation as separate ArgoCD Applications:
#
#   operators-layer1  (sync-wave 1) — Namespaces, OperatorGroups, Subscriptions
#   operators-layer2  (sync-wave 2) — Operands / Custom Resources
#
# Sync-wave ordering ensures layer1 (operators) reaches healthy state before
# layer2 (operands) attempts to create CRs that depend on the operator CRDs.
#
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: openshift4-operators
  namespace: openshift-gitops
spec:
  syncPolicy:
    preserveResourcesOnDeletion: false

  generators:
    - list:
        elements:
          # ------------------------------------------------------------------
          # Layer 1: Namespaces + OperatorGroups + Subscriptions
          # ------------------------------------------------------------------
          - name: operators-layer1
            path: operators/layer1-install
            wave: "1"
            destNamespace: openshift-operators-helm

          # ------------------------------------------------------------------
          # Layer 2: Operands (CRs)
          # ------------------------------------------------------------------
          - name: operators-layer2
            path: operators/layer2-operands
            wave: "2"
            destNamespace: openshift-operators-helm

  template:
    metadata:
      name: "{{name}}"
      namespace: openshift-gitops
      annotations:
        argocd.argoproj.io/sync-wave: "{{wave}}"
    spec:
      project: openshift4-community

      source:
        repoURL: https://github.com/betterthanbot/openshift4.git
        targetRevision: feature/dl
        path: "{{path}}"
        helm:
          valueFiles:
            - values.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: "{{destNamespace}}"

      syncPolicy:
        # Auto-sync DISABLED — generated Applications must be synced manually.
        # Re-enable by uncommenting the block below.
        # automated:
        #   prune: false       # never auto-delete operator namespaces or CRDs
        #   selfHeal: true
        #   allowEmpty: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true          # required for large ArgoCD / operator CRs
          - RespectIgnoreDifferences=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m

      # Ignore fields that operators / OCP manage themselves after creation
      ignoreDifferences:
        # OLM updates status and adds annotations after subscription creation
        - group: operators.coreos.com
          kind: Subscription
          jsonPointers:
            - /status
        - group: operators.coreos.com
          kind: OperatorGroup
          jsonPointers:
            - /metadata/annotations/olm.providedAPIs
        # ArgoCD CR is owned by the GitOps operator — ownerRef changes are expected
        - group: argoproj.io
          kind: ArgoCD
          jsonPointers:
            - /status
            - /metadata/ownerReferences
        # HCO operator defaults and reconciles most spec fields (certConfig,
        # featureGates, etc.) and status after HyperConverged creation
        - group: hco.kubevirt.io
          kind: HyperConverged
          jsonPointers:
            - /status
        # RHACS operator manages status after Central creation
        - group: platform.stackrox.io
          kind: Central
          jsonPointers:
            - /status
        - group: platform.stackrox.io
          kind: SecuredCluster
          jsonPointers:
            - /status
        # LokiStack S3 secret — placeholder is committed; real values are set manually.
        # Ignore data so ArgoCD never overwrites credentials after they are entered.
        - group: ""
          kind: Secret
          name: logging-loki-s3
          namespace: openshift-logging
          jsonPointers:
            - /data
        - group: ""
          kind: Secret
          name: netobserv-loki-s3
          namespace: netobserv
          jsonPointers:
            - /data
        # Workshop HTPasswd secret — placeholder (empty) is committed; real user
        # hashes are set manually via `oc edit`/`oc apply`, never committed to git.
        - group: ""
          kind: Secret
          name: workshop-htpasswd
          namespace: openshift-config
          jsonPointers:
            - /data
        # Grafana datasource bearer token is injected by the grafana-auth-job sync hook.
        # Ignore secureJsonData so ArgoCD does not reset it to empty on each sync.
        - group: grafana.integreatly.org
          kind: GrafanaDatasource
          jsonPointers:
            - /spec/datasource/secureJsonData
